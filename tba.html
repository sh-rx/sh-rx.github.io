<!DOCTYPE html>
<html>
<head>
  <title>My Web MUD</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <style>
    body { 
      background-color: #000; 
      margin: 0; 
      padding: 15px; 
      display: flex; 
      flex-direction: column; 
      height: 100vh; 
      box-sizing: border-box; 
    }
    #terminal-container { 
      flex-grow: 1; 
      overflow: hidden; 
    }
    #input-container { 
      display: flex; 
      margin-top: 10px; 
      margin-bottom: 15px;
    }
    #cmd-input { 
      flex-grow: 1; 
      padding: 12px; 
      font-family: '"Courier New", courier-new, courier, monospace'; 
      font-size: 16px; 
      background: #111; 
      color: #00ff00; /* Green typing text */
      border: 1px solid #444; 
      border-radius: 4px;
      outline: none; 
    }
    #cmd-input:focus { 
      border-color: #888; 
    }
  </style>
</head>
<body>
  <div id="terminal-container"></div>
  <div id="input-container">
    <input type="text" id="cmd-input" placeholder="Type commands here and press Enter..." autocomplete="off" autofocus />
  </div>

  <script>
    // 1. Initialize the Terminal
    const term = new Terminal({
      cursorBlink: false, // Turned off since we use the input bar below
      fontFamily: '"Courier New", courier-new, courier, monospace',
      theme: { background: '#000000' }
    });
    term.open(document.getElementById('terminal-container'));
    term.writeln('\x1b[33mInitializing connection...\x1b[0m');

    // 2. IMPORTANT: Paste your Cloudflare URL below!
    // Remember to use 'wss://'
    const myCloudflareUrl = 'wss://attending-ownership-yoga-infrared.trycloudflare.com'; 

    // Connect to Websockify
    const ws = new WebSocket(myCloudflareUrl);

    ws.onopen = () => {
      term.writeln('\x1b[32m*** Connected to Server! ***\x1b[0m\r\n');
    };

    // 3. Receive data from the MUD and print to terminal
    ws.onmessage = async (event) => {
      let text = event.data;
      if (event.data instanceof Blob) {
        text = await event.data.text();
      }
      term.write(text);
    };

    // 4. Handle the Input Bar
    const cmdInput = document.getElementById('cmd-input');
    cmdInput.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        const val = cmdInput.value;
        
        // Echo what you typed to the screen in a subtle cyan color
        term.writeln('\x1b[36m> ' + val + '\x1b[0m');
        
        if (ws.readyState === WebSocket.OPEN) {
          // Add the Telnet line endings
          const commandString = val + '\r\n';
          
          // CRITICAL FIX: Convert the text string into raw binary bytes
          const encoder = new TextEncoder();
          const byteData = encoder.encode(commandString);
          
          // Send the raw bytes to Websockify
          ws.send(byteData);
        }
        
        // Clear the input bar
        cmdInput.value = '';
      }
    });

    // Automatically keep focus on the input bar if you click the terminal
    document.getElementById('terminal-container').addEventListener('click', () => {
      cmdInput.focus();
    });

    ws.onclose = () => {
      term.writeln('\r\n\x1b[31m*** Disconnected from server ***\x1b[0m');
    };
    
    ws.onerror = (err) => {
      term.writeln('\r\n\x1b[31m*** Connection Error - Check console ***\x1b[0m');
    };
  </script>
</body>
</html>
