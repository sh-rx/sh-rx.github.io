<!DOCTYPE html>
<html>
<head>
  <title></title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.7.0/lib/xterm-addon-fit.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    body { background-color: #000; margin: 0; padding: 15px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; font-family: sans-serif; }
    #overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: #111; display: flex; align-items: center; justify-content: center; z-index: 9999; }
    #box { background: #222; padding: 30px; border-radius: 8px; border: 1px solid #444; text-align: center; }
    #input { padding: 10px; font-size: 18px; width: 150px; text-align: center; background: #000; color: #00ff00; border: 1px solid #555; border-radius: 4px; letter-spacing: 5px; outline: none; }
    #server { margin-bottom: 14px; padding: 9px; font-size: 15px; width: 174px; background: #000; color: #00ff00; border: 1px solid #555; border-radius: 4px; outline: none; font-family: monospace; }

    #app { display: none; flex-direction: column; height: 100%; }
    #tabs { display: flex; gap: 4px; margin-bottom: 8px; align-items: stretch; flex-shrink: 0; }
    .tab { background: #111; color: #555; border: 1px solid #333; border-radius: 3px 3px 0 0; font-family: monospace; font-size: 14px; padding: 6px 13px; cursor: pointer; outline: none; }
    .tab.on { color: #00ff00; border-color: #444; background: #000; }
    .tab .dot { color: #b58900; }
    #terms { flex-grow: 1; position: relative; overflow: hidden; }
    .sess { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
    #bar { display: flex; margin-top: 10px; gap: 6px; flex-shrink: 0; align-items: flex-end; }
    #cmd { flex-grow: 1; min-width: 0; padding: 12px; font-family: monospace; font-size: 16px; line-height: 1.3; background: #111; color: #00ff00; border: 1px solid #444; outline: none; resize: none; overflow-y: auto; max-height: 150px; }
    #cmd::selection { background: #00ff00; color: #000; }
    #cmd::-moz-selection { background: #00ff00; color: #000; }
    #add, #rc, #xt { background: #111; color: #555; border: 1px solid #333; font-family: monospace; font-size: 15px; padding: 0 11px; outline: none; cursor: pointer; -webkit-appearance: none; appearance: none; text-align: center; }
    #add { padding: 6px 9px; border-radius: 3px; }
    #add:hover, #rc:hover, #xt:hover, #add:focus, #rc:focus, #xt:focus { color: #00ff00; border-color: #444; }
  </style>
</head>
<body>
  <div id="overlay">
    <div id="box">
      <h2 style="color:#aaa;"></h2>
      <select id="server">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
      </select><br />
      <input type="password" id="input" autofocus autocomplete="off" />
    </div>
  </div>

  <div id="app">
    <div id="tabs"></div>
    <div id="terms"></div>
    <div id="bar">
      <textarea id="cmd" rows="1" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
      <button id="rc" title="reconnect">&#8635;</button>
      <button id="xt" title="close tab">&#215;</button>
    </div>
  </div>

  <script>
    const reg = "025ac3ddef52e0aaa62896954c6fe57948a7c144cb203610499a912b832fd473";
    const TUNNEL = "wss://castle-style-stuart-develops.trycloudflare.com";
    const MAX_TABS = 6;
    const SEND_DELAY = 120;   // ms between lines of a pasted block

    let sessions = [], active = -1, isMobile = false;

    async function verify(v) {
      const buffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v));
      const hash = Array.from(new Uint8Array(buffer)).map(b => b.toString(16).padStart(2, '0')).join('');
      return hash === reg;
    }

    const input = document.getElementById('input');
    input.addEventListener('keypress', async (e) => {
      if (e.key === 'Enter') {
        if (await verify(input.value)) {
          const first = document.getElementById('server').value;
          document.getElementById('overlay').style.display = 'none';
          document.getElementById('app').style.display = 'flex';
          init(first);
        } else {
          input.value = '';
        }
      }
    });

    // Grow the command box to fit its contents, up to the CSS max-height.
    function autosize() {
      const cmd = document.getElementById('cmd');
      cmd.style.height = 'auto';
      cmd.style.height = cmd.scrollHeight + 'px';
    }

    // Highlight whatever is in the command box, deferred so the browser
    // does not move the caret back to the end afterwards.
    function selectCmd() {
      const cmd = document.getElementById('cmd');
      if (!cmd.value) return;
      cmd.focus();
      setTimeout(() => cmd.setSelectionRange(0, cmd.value.length), 0);
    }

    // --- tab bar -------------------------------------------------------
    function renderTabs() {
      const bar = document.getElementById('tabs');
      bar.innerHTML = '';
      sessions.forEach((s, i) => {
        const b = document.createElement('button');
        b.className = 'tab' + (i === active ? ' on' : '');
        b.innerHTML = s.token + (s.unread && i !== active ? ' <span class="dot">&bull;</span>' : '');
        b.addEventListener('click', () => activate(i));
        bar.appendChild(b);
      });
      if (sessions.length < MAX_TABS) {
        const sel = document.createElement('select');
        sel.id = 'add';
        sel.innerHTML = '<option value="">+</option><option value="1">1</option><option value="2">2</option><option value="3">3</option>';
        sel.addEventListener('change', (e) => {
          if (e.target.value) openTab(e.target.value);
        });
        bar.appendChild(sel);
      }
    }

    function activate(i) {
      active = i;
      sessions.forEach((s, n) => { s.el.style.display = n === i ? 'block' : 'none'; });
      const s = sessions[i];
      s.unread = false;
      // A hidden terminal measures as zero, so fit only once it is visible.
      s.fit.fit();
      renderTabs();
      // Each tab remembers its own last command.
      const cmd = document.getElementById('cmd');
      cmd.value = s.last || '';
      autosize();
      cmd.focus();
      selectCmd();
    }

    // --- sessions ------------------------------------------------------
    function openTab(token) {
      if (sessions.length >= MAX_TABS) return;
      const el = document.createElement('div');
      el.className = 'sess';
      el.style.display = 'none';
      document.getElementById('terms').appendChild(el);

      const term = new Terminal({
        theme: { background: '#000' },
        fontSize: isMobile ? 10 : 15,
        fontFamily: 'monospace',
        scrollback: 1500
      });
      const fit = new FitAddon.FitAddon();
      term.loadAddon(fit);
      term.open(el);

      const s = { token: token, term: term, fit: fit, el: el, ws: null, unread: false, last: '' };
      sessions.push(s);
      activate(sessions.length - 1);
      connect(s);
    }

    function connect(s) {
      if (s.ws) {
        s.ws.onmessage = s.ws.onclose = s.ws.onerror = s.ws.onopen = null;
        try { s.ws.close(); } catch (err) {}
      }
      s.term.writeln('\x1b[90m--- connecting to ' + s.token + ' ---\x1b[0m');
      const ws = new WebSocket(TUNNEL + '/?token=' + encodeURIComponent(s.token));
      s.ws = ws;
      ws.onopen = () => s.term.writeln('\x1b[90m--- connected ---\x1b[0m');
      ws.onmessage = async (e) => {
        s.term.write(e.data instanceof Blob ? await e.data.text() : e.data);
        if (sessions[active] !== s && !s.unread) { s.unread = true; renderTabs(); }
      };
      ws.onclose = () => s.term.writeln('\x1b[31m--- disconnected ---\x1b[0m');
      ws.onerror = () => s.term.writeln('\x1b[31m--- could not reach ' + s.token + ' ---\x1b[0m');
    }

    function closeTab() {
      if (sessions.length < 2) return;   // always keep one open
      const s = sessions[active];
      if (s.ws) {
        s.ws.onmessage = s.ws.onclose = s.ws.onerror = s.ws.onopen = null;
        try { s.ws.close(); } catch (err) {}
      }
      s.term.dispose();
      s.el.remove();
      sessions.splice(active, 1);
      activate(Math.min(active, sessions.length - 1));
    }

    // --- startup -------------------------------------------------------
    function init(first) {
      isMobile = window.innerWidth <= 768;
      openTab(first);

      window.addEventListener('resize', () => { if (active >= 0) sessions[active].fit.fit(); });

      // Send a blank return every 45 seconds to keep the network tunnel hot
      setInterval(() => {
        sessions.forEach((s) => {
          if (s.ws && s.ws.readyState === WebSocket.OPEN) {
            s.ws.send(new TextEncoder().encode('\r\n'));
          }
        });
      }, 45000);

      document.getElementById('rc').addEventListener('click', () => connect(sessions[active]));
      document.getElementById('xt').addEventListener('click', closeTab);

     
      let wakeLock = null;
      async function requestWakeLock() {
        try {
          if ('wakeLock' in navigator) {
            wakeLock = await navigator.wakeLock.request('screen');
            console.log('Screen Wake Lock is active');
          }
        } catch (err) {
          console.log('Wake Lock failed:', err);
        }
      }
      requestWakeLock();

      document.addEventListener('visibilitychange', async () => {
        if (wakeLock !== null && document.visibilityState === 'visible') {
          requestWakeLock();
        }
      });

      const cmd = document.getElementById('cmd');

      // One line per MUD command, paced so a long paste does not trip spam guards.
      async function sendBlock(s, text) {
        if (s.sending) return;
        const lines = text === '' ? [''] : text.split(/\r?\n/);
        s.sending = true;
        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          s.term.writeln('\x1b[36m> ' + line + '\x1b[0m');
          if (s.ws && s.ws.readyState === WebSocket.OPEN) {
            s.ws.send(new TextEncoder().encode(line + '\r\n'));
          }
          if (i < lines.length - 1) await new Promise(r => setTimeout(r, SEND_DELAY));
        }
        s.sending = false;
      }

      cmd.addEventListener('input', autosize);

      cmd.addEventListener('keydown', (e) => {
        // Shift+Enter adds a line instead of sending.
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          const s = sessions[active];
          const text = cmd.value;
          sendBlock(s, text);
          s.last = text;
          // Leave the text in place, selected: Enter repeats it, anything else replaces it.
          selectCmd();
        }
      });
    }
  </script>
</body>
</html>
