<!DOCTYPE html>
<html>
<head>
  <title></title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    body { background-color: #000; margin: 0; padding: 15px; display: flex; flex-direction: column; height: 100vh; height: 100dvh; box-sizing: border-box; font-family: sans-serif; }
    #overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: #111; display: flex; align-items: center; justify-content: center; z-index: 9999; }
    #box { background: #222; padding: 30px; border-radius: 8px; border: 1px solid #444; text-align: center; }
    #input { padding: 10px; font-size: 18px; width: 150px; text-align: center; background: #000; color: #00ff00; border: 1px solid #555; border-radius: 4px; letter-spacing: 5px; outline: none; }
    #server { margin-bottom: 14px; padding: 9px; font-size: 15px; width: 174px; background: #000; color: #00ff00; border: 1px solid #555; border-radius: 4px; outline: none; font-family: monospace; }

    #app { display: none; flex-direction: column; height: 100%; flex: 1 1 auto; min-height: 0; }
    #tabs { display: flex; gap: 4px; margin-bottom: 8px; align-items: stretch; flex-shrink: 0; }
    .tab { background: #111; color: #555; border: 1px solid #333; border-radius: 3px 3px 0 0; font-family: monospace; font-size: 14px; padding: 6px 13px; cursor: pointer; outline: none; }
    .tab.on { color: #00ff00; border-color: #444; background: #000; }
    .tab .dot { color: #b58900; }
    #terms { flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden; }
    /* Hidden tabs stay laid out; display:none would zero their size and
       break xterm's character measurement. */
    .sess { position: absolute; top: 0; left: 0; right: 0; bottom: 0; visibility: hidden; z-index: 0; }
    .sess.on { visibility: visible; z-index: 1; }
    #bar { display: flex; margin-top: 10px; gap: 6px; flex-shrink: 0; align-items: flex-end; }
    #cmd { flex-grow: 1; min-width: 0; box-sizing: border-box; display: block; padding: 12px; font-family: monospace; font-size: 16px; line-height: 1.3; background: #111; color: #00ff00; border: 1px solid #444; outline: none; resize: none; overflow-y: auto; max-height: 150px; }
    #cmd::selection { background: #00ff00; color: #000; }
    #cmd::-moz-selection { background: #00ff00; color: #000; }
    #add, #rc, #xt { background: #111; color: #555; border: 1px solid #333; font-family: monospace; font-size: 15px; padding: 0 11px; outline: none; cursor: pointer; -webkit-appearance: none; appearance: none; text-align: center; }
    #add { padding: 6px 9px; border-radius: 3px; }
    #add:hover, #rc:hover, #xt:hover, #add:focus, #rc:focus, #xt:focus { color: #00ff00; border-color: #444; }
  </style>
</head>
<body>
  <div id="overlay">
    <div id="box">
      <h2 style="color:#aaa;"></h2>
      <select id="server">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
      </select><br />
      <input type="password" id="input" autofocus autocomplete="off" />
    </div>
  </div>

  <div id="app">
    <div id="tabs"></div>
    <div id="terms"></div>
    <div id="bar">
      <textarea id="cmd" rows="1" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
      <button id="rc" title="reconnect">&#8635;</button>
      <button id="xt" title="close tab">&#215;</button>
    </div>
  </div>

  <script>
    const reg = "025ac3ddef52e0aaa62896954c6fe57948a7c144cb203610499a912b832fd473";
    const TUNNEL = "wss://castle-style-stuart-develops.trycloudflare.com";
    const MAX_TABS = 6;
    const SEND_DELAY = 120;   
    const HISTORY_MAX = 100;  

    let sessions = [], active = -1, isMobile = false;

    async function verify(v) {
      const buffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v));
      const hash = Array.from(new Uint8Array(buffer)).map(b => b.toString(16).padStart(2, '0')).join('');
      return hash === reg;
    }

    const input = document.getElementById('input');
    input.addEventListener('keypress', async (e) => {
      if (e.key === 'Enter') {
        if (await verify(input.value)) {
          const first = document.getElementById('server').value;
          document.getElementById('overlay').style.display = 'none';
          document.getElementById('app').style.display = 'flex';
          init(first);
        } else {
          input.value = '';
        }
      }
    });

 
    function cellSize() {
      const probe = document.createElement('span');
      probe.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;line-height:normal;font-family:monospace;';
      probe.style.fontSize = (isMobile ? 10 : 15) + 'px';
      probe.textContent = 'W'.repeat(50);
      document.body.appendChild(probe);
      const r = probe.getBoundingClientRect();
      probe.remove();
      return r.width > 0 ? { w: r.width / 50, h: r.height } : null;
    }

   
    function fitSession(s) {
      try { s.fit.fit(); } catch (err) {}
      const box = document.getElementById('terms');
      const c = cellSize();
      if (!c || !box.clientHeight) return;
      const rows = Math.max(5, Math.floor(box.clientHeight / c.h));
      const cols = Math.max(20, Math.floor((box.clientWidth - 18) / c.w));
      if (s.term.rows < rows * 0.85 || s.term.cols < cols * 0.85) {
        try { s.term.resize(cols, rows); } catch (err) {}
      }
    }

  
    function autosize() {
      const cmd = document.getElementById('cmd');
      cmd.style.height = 'auto';
      cmd.style.height = (cmd.scrollHeight + 2) + 'px';
    }


    function selectCmd() {
      const cmd = document.getElementById('cmd');
      if (!cmd.value) return;
      cmd.focus();
      setTimeout(() => cmd.setSelectionRange(0, cmd.value.length), 0);
    }

    // --- tab bar -------------------------------------------------------
    function renderTabs() {
      const bar = document.getElementById('tabs');
      bar.innerHTML = '';
      sessions.forEach((s, i) => {
        const b = document.createElement('button');
        b.className = 'tab' + (i === active ? ' on' : '');
        b.innerHTML = s.token + (s.unread && i !== active ? ' <span class="dot">&bull;</span>' : '');
        b.addEventListener('click', () => activate(i));
        bar.appendChild(b);
      });
      if (sessions.length < MAX_TABS) {
        const sel = document.createElement('select');
        sel.id = 'add';
        sel.innerHTML = '<option value="">+</option><option value="1">1</option><option value="2">2</option><option value="3">3</option>';
        sel.addEventListener('change', (e) => {
          if (e.target.value) openTab(e.target.value);
        });
        bar.appendChild(sel);
      }
    }

    function activate(i) {
      active = i;
      sessions.forEach((s, n) => { s.el.className = 'sess' + (n === i ? ' on' : ''); });
      const s = sessions[i];
      s.unread = false;
      fitSession(s);
      // Re-fit once layout has settled, in case fonts or the bar shifted things.
      requestAnimationFrame(() => { if (sessions[active] === s) fitSession(s); });
      renderTabs();
      // Each tab remembers its own last command.
      const cmd = document.getElementById('cmd');
      cmd.value = s.last || '';
      s.hi = -1;
      autosize();
      cmd.focus();
      selectCmd();
    }

    // --- sessions ------------------------------------------------------
    function openTab(token) {
      if (sessions.length >= MAX_TABS) return;
      const el = document.createElement('div');
      el.className = 'sess';
      document.getElementById('terms').appendChild(el);

      const term = new Terminal({
        theme: { background: '#000' },
        fontSize: isMobile ? 10 : 15,
        fontFamily: 'monospace',
        scrollback: 1500
      });
      const fit = new FitAddon.FitAddon();
      term.loadAddon(fit);
      term.open(el);

      const s = { token: token, term: term, fit: fit, el: el, ws: null, unread: false, last: '', hist: [], hi: -1, draft: '' };
      sessions.push(s);
      activate(sessions.length - 1);
      connect(s);
    }

    function connect(s) {
      if (s.ws) {
        s.ws.onmessage = s.ws.onclose = s.ws.onerror = s.ws.onopen = null;
        try { s.ws.close(); } catch (err) {}
      }
      s.term.writeln('\x1b[90m--- connecting to ' + s.token + ' ---\x1b[0m');
      const ws = new WebSocket(TUNNEL + '/?token=' + encodeURIComponent(s.token));
      s.ws = ws;
      ws.onopen = () => s.term.writeln('\x1b[90m--- connected ---\x1b[0m');
      ws.onmessage = async (e) => {
        s.term.write(e.data instanceof Blob ? await e.data.text() : e.data);
        if (sessions[active] !== s && !s.unread) { s.unread = true; renderTabs(); }
      };
      ws.onclose = () => s.term.writeln('\x1b[31m--- disconnected ---\x1b[0m');
      ws.onerror = () => s.term.writeln('\x1b[31m--- could not reach ' + s.token + ' ---\x1b[0m');
    }

    function closeTab() {
      if (sessions.length < 2) return;   
      const s = sessions[active];
      if (s.ws) {
        s.ws.onmessage = s.ws.onclose = s.ws.onerror = s.ws.onopen = null;
        try { s.ws.close(); } catch (err) {}
      }
      s.term.dispose();
      s.el.remove();
      sessions.splice(active, 1);
      activate(Math.min(active, sessions.length - 1));
    }

    // --- startup -------------------------------------------------------
    function init(first) {
      isMobile = window.innerWidth <= 768;
      openTab(first);

      window.addEventListener('resize', () => { if (active >= 0) fitSession(sessions[active]); });

      // The command box grows and shrinks as you type or paste; the terminal
      // has to re-measure or it keeps rendering at its old size.
      if (window.ResizeObserver) {
        new ResizeObserver(() => {
          if (active >= 0) fitSession(sessions[active]);
        }).observe(document.getElementById('bar'));
      }

      autosize();

      // The xterm stylesheet may land after the first fit; measure again.
      setTimeout(() => { if (active >= 0) fitSession(sessions[active]); }, 250);

      // Send a blank return every 45 seconds to keep the network tunnel hot
      setInterval(() => {
        sessions.forEach((s) => {
          if (s.ws && s.ws.readyState === WebSocket.OPEN) {
            s.ws.send(new TextEncoder().encode('\r\n'));
          }
        });
      }, 45000);

      document.getElementById('rc').addEventListener('click', () => connect(sessions[active]));
      document.getElementById('xt').addEventListener('click', closeTab);

   
      let wakeLock = null;
      async function requestWakeLock() {
        try {
          if ('wakeLock' in navigator) {
            wakeLock = await navigator.wakeLock.request('screen');
            console.log('Screen Wake Lock is active');
          }
        } catch (err) {
          console.log('Wake Lock failed:', err);
        }
      }
      requestWakeLock();

      document.addEventListener('visibilitychange', async () => {
        if (wakeLock !== null && document.visibilityState === 'visible') {
          requestWakeLock();
        }
      });

      const cmd = document.getElementById('cmd');

      async function sendBlock(s, text) {
        if (s.sending) return;
        const lines = text === '' ? [''] : text.split(/\r?\n/);
        s.sending = true;
        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          s.term.writeln('\x1b[36m> ' + line + '\x1b[0m');
          if (s.ws && s.ws.readyState === WebSocket.OPEN) {
            s.ws.send(new TextEncoder().encode(line + '\r\n'));
          }
          if (i < lines.length - 1) await new Promise(r => setTimeout(r, SEND_DELAY));
        }
        s.sending = false;
      }

      cmd.addEventListener('input', autosize);

     
      function recall(text) {
        cmd.value = text;
        autosize();
        selectCmd();
      }

  
      function atFirstLine() {
        const nl = cmd.value.indexOf('\n');
        return nl === -1 || cmd.selectionStart <= nl;
      }
      function atLastLine() {
        const nl = cmd.value.lastIndexOf('\n');
        return nl === -1 || cmd.selectionEnd > nl;
      }

      cmd.addEventListener('keydown', (e) => {
        const s = sessions[active];

        if (e.key === 'ArrowUp' && atFirstLine()) {
          if (!s.hist.length || s.hi >= s.hist.length - 1) return;
          e.preventDefault();
          if (s.hi === -1) s.draft = cmd.value;   // keep what was being typed
          s.hi++;
          recall(s.hist[s.hist.length - 1 - s.hi]);
          return;
        }

        if (e.key === 'ArrowDown' && atLastLine()) {
          if (s.hi < 0) return;
          e.preventDefault();
          s.hi--;
          recall(s.hi === -1 ? s.draft : s.hist[s.hist.length - 1 - s.hi]);
          return;
        }

        // Shift+Enter adds a line instead of sending.
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          const text = cmd.value;
          sendBlock(s, text);
          s.last = text;
          if (text && s.hist[s.hist.length - 1] !== text) s.hist.push(text);
          if (s.hist.length > HISTORY_MAX) s.hist.shift();
          s.hi = -1;
          s.draft = '';
          // Leave the text in place, selected: Enter repeats it, anything else replaces it.
          selectCmd();
        }
      });
    }
  </script>
</body>
</html>
