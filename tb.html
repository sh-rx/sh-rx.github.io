<!DOCTYPE html>
<html>
<head>
  <title></title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.7.0/lib/xterm-addon-fit.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    body { background-color: #000; margin: 0; padding: 15px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; font-family: sans-serif; }
    #overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: #111; display: flex; align-items: center; justify-content: center; z-index: 9999; }
    #box { background: #222; padding: 30px; border-radius: 8px; border: 1px solid #444; text-align: center; }
    #input { padding: 10px; font-size: 18px; width: 150px; text-align: center; background: #000; color: #00ff00; border: 1px solid #555; border-radius: 4px; letter-spacing: 5px; outline: none; }
    #app { display: none; flex-direction: column; height: 100%; }
    #term { flex-grow: 1; overflow: hidden; }
    #cmd { flex-grow: 1; padding: 12px; font-family: monospace; font-size: 16px; background: #111; color: #00ff00; border: 1px solid #444; outline: none; }
  </style>
</head>
<body>
  <div id="overlay">
    <div id="box">
      <h2 style="color:#aaa;"></h2>
      <input type="password" id="input" autofocus autocomplete="off" />
    </div>
  </div>

  <div id="app">
    <div id="term"></div>
    <div style="display:flex; margin-top:10px;"><input type="text" id="cmd" autocomplete="off" /></div>
  </div>

  <script>
    const reg = "025ac3ddef52e0aaa62896954c6fe57948a7c144cb203610499a912b832fd473";
    
    async function verify(v) {
      const buffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v));
      const hash = Array.from(new Uint8Array(buffer)).map(b => b.toString(16).padStart(2, '0')).join('');
      return hash === reg;
    }

    const input = document.getElementById('input');
    input.addEventListener('keypress', async (e) => {
      if (e.key === 'Enter') {
        if (await verify(input.value)) {
          document.getElementById('overlay').style.display = 'none';
          document.getElementById('app').style.display = 'flex';
          init();
        } else {
          input.value = '';
        }
      }
    });

    function init() {
      // Check if we are on a mobile-sized screen
      const isMobile = window.innerWidth <= 768;

      // Set font size based on screen size (10 for mobile, 15 for desktop)
      const term = new Terminal({ 
        theme: { background: '#000' },
        fontSize: isMobile ? 10 : 15,
        fontFamily: 'monospace'
      });
      
      const fit = new FitAddon.FitAddon();
      term.loadAddon(fit);
      term.open(document.getElementById('term'));
      fit.fit();
      
      // Re-calculate the grid if you rotate your phone
      window.addEventListener('resize', () => fit.fit());
      
      const ws = new WebSocket('wss://attending-ownership-yoga-infrared.trycloudflare.com');
      ws.onmessage = async (e) => term.write(e.data instanceof Blob ? await e.data.text() : e.data);

      // Send a blank return every 45 seconds to keep the network tunnel hot
      setInterval(() => {
        if (ws.readyState === WebSocket.OPEN) {
          ws.send(new TextEncoder().encode('\r\n')); 
        }
      }, 45000);

      // Request the phone to keep the screen on while the MUD is running
      let wakeLock = null;
      async function requestWakeLock() {
        try {
          if ('wakeLock' in navigator) {
            wakeLock = await navigator.wakeLock.request('screen');
            console.log('Screen Wake Lock is active');
          }
        } catch (err) {
          console.log('Wake Lock failed:', err);
        }
      }
      // Trigger the lock
      requestWakeLock();
      
      // Re-trigger the lock if you minimize the browser and come back
      document.addEventListener('visibilitychange', async () => {
        if (wakeLock !== null && document.visibilityState === 'visible') {
          requestWakeLock();
        }
      });
      
      const cmd = document.getElementById('cmd');
      cmd.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          term.writeln('\x1b[36m> ' + cmd.value + '\x1b[0m');
          if (ws.readyState === WebSocket.OPEN) ws.send(new TextEncoder().encode(cmd.value + '\r\n'));
          cmd.value = '';
        }
      });
    }
  </script>
</body>
</html>
