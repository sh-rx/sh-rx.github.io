<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shift Scheduler</title>
<style>
  :root {
    --bg:        #16181c;
    --panel:     #1e2127;
    --panel-2:   #262a32;
    --line:      #333842;
    --line-soft: #2a2e36;
    --text:      #e3e6ea;
    --text-dim:  #949cab;
    --text-mute: #646b78;
    --accent:    #5b8bb8;
    --accent-dk: #3d6484;
    --ok:        #3f8f4a;
    --short:     #c0392b;
    --over:      #d9822b;
    --float:     #d9a441;
    --gap:       #c0392b;
    --radius:    6px;
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 24px;
    max-width: 1600px;
    margin-inline: auto;
    font-size: 14px;
    line-height: 1.5;
  }

  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
  .subtitle { color: var(--text-mute); font-size: 13px; margin-bottom: 22px; }

  /* ---------- nav ---------- */
  .top-nav {
    display: flex; gap: 8px; background: var(--panel);
    padding: 10px; border-radius: var(--radius);
    border: 1px solid var(--line); margin-bottom: 22px;
  }
  .nav-btn {
    padding: 8px 14px; background: transparent; border: 1px solid var(--accent-dk);
    color: var(--accent); font-size: 13px; border-radius: 4px;
    font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .nav-btn.active { background: var(--accent-dk); color: #fff; cursor: default; }

  /* ---------- controls ---------- */
  .controls {
    background: var(--panel); border: 1px solid var(--line);
    padding: 18px; border-radius: var(--radius); margin-bottom: 20px;
    display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-end;
  }
  .field { display: flex; flex-direction: column; gap: 5px; }
  label { font-weight: 600; color: var(--text-dim); font-size: 12px;
          text-transform: uppercase; letter-spacing: 0.04em; }
  input[type="date"] {
    padding: 8px 10px; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 4px;
    color-scheme: dark; font-family: inherit; font-size: 14px;
  }
  .btn {
    padding: 9px 18px; background: var(--accent-dk); color: #fff; border: none;
    cursor: pointer; font-size: 14px; border-radius: 4px; font-weight: 600;
    font-family: inherit; transition: background .15s;
  }
  .btn:hover:not(:disabled) { background: var(--accent); }
  .btn:disabled { opacity: .5; cursor: wait; }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--text-dim); }
  .btn.ghost:hover { background: var(--panel-2); color: var(--text); }
  .quick-range { display: flex; gap: 6px; }
  .chip {
    padding: 7px 11px; background: transparent; border: 1px solid var(--line);
    color: var(--text-dim); border-radius: 4px; cursor: pointer;
    font-size: 12px; font-family: inherit; font-weight: 600;
  }
  .chip:hover { border-color: var(--accent-dk); color: var(--accent); }

  /* ---------- status / banners ---------- */
  .status {
    padding: 16px; background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); color: var(--text-dim); white-space: pre-wrap;
  }
  .banner {
    border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px;
    border: 1px solid; font-size: 13px;
  }
  .banner h4 { margin: 0 0 8px; font-size: 13px; font-weight: 700;
               text-transform: uppercase; letter-spacing: .05em; }
  .banner ul { margin: 0; padding-left: 18px; }
  .banner li { margin-bottom: 4px; }
  .banner li:last-child { margin-bottom: 0; }
  .banner.err  { background: #2a1618; border-color: #7d2b2b; color: #f0b4b4; }
  .banner.warn { background: #2a2216; border-color: #7d5c2b; color: #e8cd9a; }
  .banner.info { background: #16202a; border-color: #2b5c7d; color: #a8c9e0; }

  /* ---------- tabs ---------- */
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab {
    background: transparent; border: 1px solid var(--line); color: var(--text-dim);
    padding: 8px 15px; border-radius: 4px; cursor: pointer;
    font-weight: 600; font-family: inherit; font-size: 13px;
  }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .tab .count { opacity: .65; font-weight: 500; margin-left: 5px; }
  .pane { display: none; }
  .pane.active { display: block; }

  /* ---------- master grid ---------- */
  .table-wrap {
    overflow: auto; max-height: 78vh;
    border: 1px solid var(--line); border-radius: var(--radius);
  }
  table { border-collapse: separate; border-spacing: 0; width: 100%; }
  th, td { padding: 7px 9px; text-align: center; font-size: 12.5px;
           border-right: 1px solid var(--line-soft);
           border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
  thead th {
    position: sticky; top: 0; z-index: 3;
    background: var(--accent-dk); color: #fff; font-weight: 600;
  }
  thead th.wknd { background: #2f4d66; }
  td.shift-name, thead th.corner {
    position: sticky; left: 0; z-index: 2;
    text-align: left; font-weight: 600;
    background: var(--panel-2);
    border-right: 2px solid var(--line);
  }
  thead th.corner { z-index: 4; background: var(--accent-dk); }
  td.filled { background: #21252c; }
  td.wknd-col { background: #1b1e24; }
  td.gap { background: #331a1a; color: #e88; font-weight: 600; }
  .float-tag { color: var(--float); font-weight: 700; margin-left: 3px; }

  /* ---------- employee cards ---------- */
  .card-grid {
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); overflow: hidden;
  }
  .card-head { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .card-name { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
  .card-meta { font-size: 12px; color: var(--text-mute); display: flex;
               gap: 10px; flex-wrap: wrap; }
  .pill { font-size: 10.5px; padding: 2px 6px; border-radius: 3px;
          background: var(--panel-2); border: 1px solid var(--line);
          color: var(--text-dim); font-weight: 600; letter-spacing: .03em; }
  .pill.rot { border-color: var(--accent-dk); color: var(--accent); }

  .pp { border-bottom: 1px solid var(--line-soft); }
  .pp:last-child { border-bottom: none; }
  .pp-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 14px; background: var(--panel-2);
    font-size: 12px; font-weight: 600; border-left: 3px solid var(--accent-dk);
  }
  .pp-label { color: var(--text-dim); }
  .partial { color: var(--text-mute); font-weight: 500; }
  .badge { font-size: 11px; padding: 3px 7px; border-radius: 3px;
           font-weight: 700; border: 1px solid; }
  .badge.ok    { background: var(--ok);    color: #fff; border-color: #2e6b36; }
  .badge.short { background: var(--short); color: #fff; border-color: #96281b; }
  .badge.over  { background: var(--over);  color: #fff; border-color: #a8631f; }
  .badge.na    { background: transparent;  color: var(--text-mute); border-color: var(--line); }

  .row { display: flex; justify-content: space-between; gap: 10px;
         padding: 6px 14px; font-size: 12.5px;
         border-bottom: 1px dashed var(--line-soft); }
  .row:last-child { border-bottom: none; }
  .row.wknd { background: #1a1d23; }
  .row .date { color: var(--text-dim); }
  .row .shift { font-weight: 600; }
  .empty { padding: 8px 14px; font-size: 12.5px; color: var(--text-mute); font-style: italic; }

  /* ---------- capacity ---------- */
  .stats { display: grid; gap: 12px; margin-bottom: 18px;
           grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
  .stat { background: var(--panel); border: 1px solid var(--line);
          border-radius: var(--radius); padding: 14px 16px; }
  .stat .n { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
  .stat .k { font-size: 11px; color: var(--text-mute); text-transform: uppercase;
             letter-spacing: .05em; margin-top: 3px; }

  .list-table { width: 100%; border-collapse: collapse;
                border: 1px solid var(--line); border-radius: var(--radius); }
  .list-table th { background: var(--panel-2); text-align: left; padding: 9px 12px;
                   font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
                   color: var(--text-dim); position: static; }
  .list-table td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line-soft); }
  .list-table tr:last-child td { border-bottom: none; }
  .num { text-align: right !important; font-variant-numeric: tabular-nums; }
  .neg { color: #e08585; } .pos { color: #e0b385; }

  @media (prefers-reduced-motion: no-preference) {
    .pane.active { animation: fade .2s ease; }
    @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  }
</style>
</head>
<body>

<div class="top-nav">
  <button class="nav-btn active">Schedule generator</button>
  <button class="nav-btn" onclick="window.location.href='editor.html'">Staff editor</button>
</div>

<h1>Shift scheduler</h1>
<div class="subtitle" id="epochNote">Pay periods and shift hours are defined by the server.</div>

<div class="controls">
  <div class="field">
    <label for="startDate">Start date</label>
    <input type="date" id="startDate">
  </div>
  <div class="field">
    <label for="endDate">End date</label>
    <input type="date" id="endDate">
  </div>
  <div class="field">
    <label>Snap to pay period</label>
    <div class="quick-range">
      <button class="chip" onclick="snapRange(1)">1 period</button>
      <button class="chip" onclick="snapRange(2)">2 periods</button>
      <button class="chip" onclick="snapRange(3)">3 periods</button>
    </div>
  </div>
  <button class="btn" id="goBtn" onclick="generateSchedule()">Generate schedule</button>
  <button class="btn ghost" id="csvBtn" onclick="exportCsv()" style="display:none">Export CSV</button>
</div>

<div id="results">
  <div class="status">Pick a start and end date, then generate. Snapping to whole pay
periods gives the cleanest hour totals — partial periods are prorated.</div>
</div>

<script>
const API = 'https://bombmud.vineyard.haus/api';

let LAST = null;     // full response from /generate
let CONFIG = null;   // response from /config

// ---------------------------------------------------------------------------
// Boot: read pay-period config from the server so the UI never hardcodes it.
// ---------------------------------------------------------------------------
(async function boot() {
  try {
    const r = await fetch(API + '/config');
    if (r.ok) {
      CONFIG = await r.json();
      document.getElementById('epochNote').textContent =
        `Pay periods are ${CONFIG.pay_period_days} days, anchored to ` +
        `${fmt(CONFIG.pay_period_epoch, {weekday:'long', month:'long', day:'numeric', year:'numeric'})}.`;
    }
  } catch (e) { /* config is optional; snapping just gets disabled */ }
})();

// Dates from the API are plain YYYY-MM-DD. Parsing them with new Date(str)
// treats them as UTC midnight and shifts them a day west of Greenwich, so
// every date string gets a midday local time appended first.
function fmt(dateStr, opts) {
  return new Date(dateStr + 'T12:00:00').toLocaleDateString('en-US', opts);
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function snapRange(periods) {
  if (!CONFIG) { alert('Server config unavailable, so snapping is off. Enter dates manually.'); return; }
  const epoch = new Date(CONFIG.pay_period_epoch + 'T12:00:00');
  const len = CONFIG.pay_period_days;
  const today = new Date();
  const elapsed = Math.floor((today - epoch) / 86400000);
  const currentPeriod = Math.floor(elapsed / len);

  const start = new Date(epoch); start.setDate(start.getDate() + currentPeriod * len);
  const end = new Date(start);   end.setDate(end.getDate() + periods * len - 1);

  const iso = d => d.toISOString().slice(0, 10);
  document.getElementById('startDate').value = iso(start);
  document.getElementById('endDate').value = iso(end);
}

// ---------------------------------------------------------------------------
// Generate
// ---------------------------------------------------------------------------
async function generateSchedule() {
  const startDate = document.getElementById('startDate').value;
  const endDate = document.getElementById('endDate').value;
  const out = document.getElementById('results');
  const btn = document.getElementById('goBtn');

  if (!startDate || !endDate) { alert('Pick both a start and an end date.'); return; }
  if (endDate < startDate) { alert('The end date falls before the start date.'); return; }

  btn.disabled = true;
  document.getElementById('csvBtn').style.display = 'none';
  out.innerHTML = '<div class="status">Loading staff and solving. This can take up to 30 seconds.</div>';

  try {
    const staffRes = await fetch(API + '/staff');
    if (!staffRes.ok) throw new Error('Could not load staff from the server.');
    const employees = await staffRes.json();
    if (!employees.length) throw new Error('The staff list on the server is empty.');

    const res = await fetch(API + '/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ start_date: startDate, end_date: endDate, employees })
    });
    const data = await res.json();

    if (data.status !== 'success') { renderFailure(data); return; }

    LAST = data;
    document.getElementById('csvBtn').style.display = '';
    render(data);
  } catch (err) {
    out.innerHTML = `<div class="banner err"><h4>Request failed</h4>${esc(err.message)}</div>`;
  } finally {
    btn.disabled = false;
  }
}

function renderFailure(data) {
  let html = `<div class="banner err"><h4>Cannot build a schedule</h4>${esc(data.message || 'Unknown error.')}`;
  if (data.conflicts?.length) {
    html += `<ul>${data.conflicts.map(c => `<li>${esc(c)}</li>`).join('')}</ul>`;
  }
  html += `</div>`;
  if (data.warnings?.length) {
    html += `<div class="banner warn"><h4>Also worth checking</h4><ul>${
      data.warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>`;
  }
  document.getElementById('results').innerHTML = html;
}

// ---------------------------------------------------------------------------
// Render
// ---------------------------------------------------------------------------
function render(data) {
  const gapCount = data.shortages?.length || 0;
  const warnCount = data.meta.warnings?.length || 0;

  let banners = '';
  if (warnCount) {
    banners += `<div class="banner warn"><h4>${warnCount} thing${warnCount > 1 ? 's' : ''} to look at</h4><ul>${
      data.meta.warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>`;
  }

  document.getElementById('results').innerHTML = `
    ${banners}
    <div class="tabs">
      <button class="tab active" data-pane="grid" onclick="showPane('grid')">Master grid</button>
      <button class="tab" data-pane="people" onclick="showPane('people')">Pay period breakdown</button>
      <button class="tab" data-pane="gaps" onclick="showPane('gaps')">Gaps<span class="count">${gapCount}</span></button>
      <button class="tab" data-pane="capacity" onclick="showPane('capacity')">Capacity</button>
    </div>
    <div class="pane active" id="pane-grid">${buildGrid(data)}</div>
    <div class="pane" id="pane-people">${buildPeople(data)}</div>
    <div class="pane" id="pane-gaps">${buildGaps(data)}</div>
    <div class="pane" id="pane-capacity">${buildCapacity(data)}</div>
  `;
}

function showPane(name) {
  document.querySelectorAll('.tab').forEach(t =>
    t.classList.toggle('active', t.dataset.pane === name));
  document.querySelectorAll('.pane').forEach(p =>
    p.classList.toggle('active', p.id === 'pane-' + name));
}

// --- Master grid -----------------------------------------------------------
function buildGrid(data) {
  const order = data.meta.shift_order;
  const days = data.schedule;

  let head = '<tr><th class="corner">Shift</th>';
  days.forEach(d => {
    head += `<th class="${d.is_weekend ? 'wknd' : ''}">${esc(d.label)}</th>`;
  });
  head += '</tr>';

  let body = '';
  order.forEach(shiftName => {
    body += `<tr><td class="shift-name">${esc(shiftName)}</td>`;
    days.forEach(d => {
      const people = d.shifts.filter(s => s.shift === shiftName);
      const gap = d.gaps.find(g => g.shift === shiftName);
      const cls = [];
      if (d.is_weekend) cls.push('wknd-col');
      if (people.length) cls.push('filled');
      if (gap) cls.push('gap');

      let cell = '';
      people.forEach(p => {
        cell += `<div>${esc(p.display_name)}${
          p.is_float ? '<span class="float-tag" title="Float / backup unit">F</span>' : ''}</div>`;
      });
      if (gap) cell += `<div>unfilled</div>`;
      if (!cell) cell = '<span style="color:var(--text-mute)">&middot;</span>';

      body += `<td class="${cls.join(' ')}">${cell}</td>`;
    });
    body += '</tr>';
  });

  return `<div class="table-wrap"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}

// --- Pay period breakdown --------------------------------------------------
// Every number here comes straight from the server. The frontend used to
// recompute pay periods and shift hours on its own, which is how the two
// sides drifted apart.
function buildPeople(data) {
  const cards = data.employee_summary.map(emp => {
    const rot = emp.rotation
      ? `<span class="pill rot">Rotation ${esc(emp.rotation)}</span>` : '';
    const home = emp.home_shifts.length
      ? `<span class="pill">${esc(emp.home_shifts.join(' / '))}</span>` : '';

    let periods = emp.periods.map(p => {
      let cls = 'na', text = `${p.scheduled_hours} h`;
      if (p.scored) {
        cls = p.delta === 0 ? 'ok' : (p.delta < 0 ? 'short' : 'over');
        text = `${p.scheduled_hours} / ${p.target_hours} h`;
      }

      const rows = p.shifts.length
        ? p.shifts.map(s => `
            <div class="row ${s.is_weekend ? 'wknd' : ''}">
              <span class="date">${esc(s.label)}</span>
              <span class="shift">${esc(s.shift)} &middot; ${s.hours}h${
                s.is_float ? '<span class="float-tag" title="Float / backup unit">F</span>' : ''}</span>
            </div>`).join('')
        : '<div class="empty">No shifts in this period.</div>';

      return `
        <div class="pp">
          <div class="pp-head">
            <span class="pp-label">${esc(p.label)}${
              p.is_partial ? ` <span class="partial">(${p.days_in_range} of 14 days)</span>` : ''}</span>
            <span class="badge ${cls}" title="${p.scored
              ? `Target ${p.target_hours} h` + (p.is_partial ? ', prorated for a partial period' : '')
              : 'Fixed 7-on/7-off rotation, so no target is scored'}">${text}</span>
          </div>
          ${rows}
        </div>`;
    }).join('');

    return `
      <div class="card">
        <div class="card-head">
          <div class="card-name">${esc(emp.name)}</div>
          <div class="card-meta">
            ${rot}${home}
            <span class="pill">${emp.total_hours} h total</span>
            <span class="pill">${emp.weekend_days} weekend day${emp.weekend_days === 1 ? '' : 's'}</span>
            ${emp.float_shifts ? `<span class="pill">${emp.float_shifts} float</span>` : ''}
          </div>
        </div>
        ${periods}
      </div>`;
  }).join('');

  return `<div class="card-grid">${cards}</div>`;
}

// --- Gaps ------------------------------------------------------------------
function buildGaps(data) {
  if (!data.shortages?.length) {
    return `<div class="banner info"><h4>Full coverage</h4>Every required slot in this
      window has someone assigned to it.</div>`;
  }
  return `
    <div class="banner err"><h4>${data.shortages.length} unfilled slot${
      data.shortages.length > 1 ? 's' : ''}</h4>
      No available, qualified person could take these. Widen someone's backup
      shifts, relax a time-off rule, or lower the required headcount.</div>
    <table class="list-table"><thead><tr><th>Slot</th></tr></thead><tbody>${
      data.shortages.map(s => `<tr><td>${esc(s)}</td></tr>`).join('')}</tbody></table>`;
}

// --- Capacity --------------------------------------------------------------
function buildCapacity(data) {
  const c = data.meta.capacity;
  const slackClass = c.slack_hours < 0 ? 'neg' : 'pos';

  const rows = [...data.employee_summary]
    .sort((a, b) => {
      const da = a.periods.reduce((t, p) => t + (p.scored ? p.delta : 0), 0);
      const db = b.periods.reduce((t, p) => t + (p.scored ? p.delta : 0), 0);
      return da - db;
    })
    .map(emp => {
      const scored = emp.periods.filter(p => p.scored);
      const target = scored.reduce((t, p) => t + p.target_hours, 0);
      const delta = emp.total_hours - target;
      const deltaCell = scored.length
        ? `<td class="num ${delta < 0 ? 'neg' : (delta > 0 ? 'pos' : '')}">${
            delta > 0 ? '+' : ''}${delta}</td>`
        : `<td class="num" style="color:var(--text-mute)">fixed</td>`;
      return `<tr>
        <td>${esc(emp.name)}</td>
        <td>${emp.rotation ? 'Rotation ' + esc(emp.rotation) : esc(emp.home_shifts[0] || '—')}</td>
        <td class="num">${emp.total_shifts}</td>
        <td class="num">${emp.total_hours}</td>
        <td class="num">${scored.length ? target : '—'}</td>
        ${deltaCell}
        <td class="num">${emp.weekend_days}</td>
      </tr>`;
    }).join('');

  return `
    <div class="stats">
      <div class="stat"><div class="n">${c.demand_hours}</div><div class="k">Hours demanded</div></div>
      <div class="stat"><div class="n">${c.supply_hours}</div><div class="k">Hours of staff targets</div></div>
      <div class="stat"><div class="n ${slackClass}">${c.slack_hours > 0 ? '+' : ''}${c.slack_hours}</div><div class="k">Slack</div></div>
      <div class="stat"><div class="n">${c.utilization_pct}%</div><div class="k">Utilization</div></div>
      <div class="stat"><div class="n">${data.meta.solve_seconds}s</div><div class="k">${esc(data.meta.solver_status)}</div></div>
    </div>
    <table class="list-table">
      <thead><tr>
        <th>Name</th><th>Home</th><th class="num">Shifts</th><th class="num">Hours</th>
        <th class="num">Target</th><th class="num">Delta</th><th class="num">Wknd days</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// --- CSV -------------------------------------------------------------------
function exportCsv() {
  if (!LAST) return;
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const lines = [['Date', 'Day', 'Shift', 'Hours', 'Employee', 'Float', 'Pay period'].join(',')];

  LAST.schedule.forEach(d => {
    d.shifts.forEach(s => lines.push([
      q(d.date), q(d.day_of_week), q(s.shift), s.hours,
      q(s.employee_name), s.is_float ? 'Y' : '', d.pp_index
    ].join(',')));
    d.gaps.forEach(g => lines.push([
      q(d.date), q(d.day_of_week), q(g.shift), '', q('UNFILLED'), '', d.pp_index
    ].join(',')));
  });

  const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `schedule_${LAST.meta.start_date}_to_${LAST.meta.end_date}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}
</script>
