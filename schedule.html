<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shift Scheduler</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="date"], input[type="file"] { margin-bottom: 10px; padding: 5px; }
        button { padding: 10px 15px; background: #4a6984; color: white; border: none; cursor: pointer; font-size: 16px; border-radius: 4px; }
        button:hover { background: #354e63; }
        #results { margin-top: 20px; white-space: pre-wrap; background: #2b2b2b; color: #a9b7c6; padding: 15px; border-radius: 5px; font-family: monospace; }
    </style>
</head>
<body>
    <h1>Shift Scheduler Engine</h1>
    
    <div class="form-group">
        <label>Start Date:</label>
        <input type="date" id="startDate" required>
    </div>
    
    <div class="form-group">
        <label>End Date:</label>
        <input type="date" id="endDate" required>
    </div>
    
    <div class="form-group">
        <label>Upload staff.json:</label>
        <input type="file" id="staffFile" accept=".json" required>
    </div>
    
    <button onclick="generateSchedule()">Generate Schedule</button>
    
    <div id="results">Waiting for input...</div>

    <script>
        async function generateSchedule() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const fileInput = document.getElementById('staffFile');
            const resultsDiv = document.getElementById('results');

            if (!startDate || !endDate || !fileInput.files.length) {
                alert("Please fill out all fields and upload staff.json.");
                return;
            }

            resultsDiv.textContent = "Crunching the schedule... this may take up to 15 seconds.";

            const fileReader = new FileReader();
            fileReader.onload = async function(e) {
                try {
                    // Parse the uploaded staff.json
                    const employees = JSON.parse(e.target.result);
                    
                    // Build the payload
                    const payload = {
                        start_date: startDate,
                        end_date: endDate,
                        employees: employees
                    };

                    // Send the POST request to your Python backend
                    const response = await fetch('https://bombmud.vineyard.haus/api/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    // Parse and display the response
                    const data = await response.json();
                    resultsDiv.textContent = JSON.stringify(data, null, 2);
                    
                } catch (error) {
                    resultsDiv.textContent = "Error: " + error.message;
                }
            };
            
            // Trigger the file read
            fileReader.readAsText(fileInput.files[0]);
        }
    </script>
</body>
</html>
