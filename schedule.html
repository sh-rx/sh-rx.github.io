<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shift Scheduler</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; padding: 20px; max-width: 1400px; margin: auto; background-color: #1e1e1e; color: #e0e0e0; }
        h1 { color: #ffffff; margin-top: 0; }
        
        /* Navigation */
        .top-nav { background: #2b2b2b; padding: 15px 20px; border-bottom: 1px solid #444; margin-bottom: 20px; display: flex; gap: 15px; border-radius: 8px; }
        .nav-btn { padding: 10px 15px; background: transparent; border: 1px solid #4a6984; color: #4a6984; font-size: 14px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .nav-btn.active { background: #4a6984; color: white; cursor: default; }

        /* Form Controls */
        .controls-container { background: #2b2b2b; padding: 20px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-end; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; color: #a9b7c6; font-size: 14px; }
        input[type="date"] { padding: 8px; background: #3c3f41; color: #fff; border: 1px solid #555; border-radius: 4px; color-scheme: dark; }
        button.action-btn { padding: 10px 20px; background: #4a6984; color: white; border: none; cursor: pointer; font-size: 16px; border-radius: 4px; font-weight: bold; transition: background 0.2s; }
        button.action-btn:hover { background: #354e63; }
        
        /* Results Area */
        #results { margin-top: 20px; font-size: 14px; }
        .status-msg { padding: 15px; background: #2b2b2b; border-radius: 5px; font-family: monospace; color: #a9b7c6; white-space: pre-wrap; }
        
        /* View Toggles */
        .view-toggles { display: flex; gap: 10px; margin-bottom: 15px; }
        .toggle-btn { background: transparent; border: 1px solid #555; color: #a9b7c6; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .toggle-btn.active { background: #e0e0e0; color: #1e1e1e; border-color: #e0e0e0; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Master Calendar Table */
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { border: 1px solid #444; padding: 10px; text-align: center; }
        th { background-color: #354e63; color: white; padding: 12px; }
        td.shift-name { font-weight: bold; background-color: #2b2b2b; text-align: right; border-right: 2px solid #555; }
        td.assigned { background-color: #3c3f41; }
        .float-tag { color: #f39c12; font-size: 0.85em; font-weight: bold; margin-left: 4px; }

        /* Employee Cards Grid */
        .emp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .emp-card { background: #2b2b2b; border: 1px solid #444; border-radius: 6px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .emp-name { font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: baseline; }
        
        /* Pay Period Sections */
        .pp-section { margin-bottom: 15px; background: #222; border-radius: 5px; overflow: hidden; border: 1px solid #333; }
        .pp-section:last-child { margin-bottom: 0; }
        .pp-header { background: #3c3f41; padding: 8px 10px; font-size: 13px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid #4a6984; border-bottom: 1px solid #333; }
        
        /* Badges */
        .hours-badge { font-size: 11px; padding: 3px 6px; border-radius: 3px; font-weight: bold; background: #2b2b2b; border: 1px solid #555; margin-left: 10px; }
        .hours-badge.ok { background: #2e7d32; color: #fff; border-color: #1b5e20; }
        .hours-badge.short { background: #c62828; color: #fff; border-color: #b71c1c; }
        .hours-badge.over { background: #ef6c00; color: #fff; border-color: #e65100; }

        .emp-shift { display: flex; justify-content: space-between; font-size: 13px; padding: 8px 10px; border-bottom: 1px dashed #333; }
        .emp-shift:last-child { border-bottom: none; }
        .emp-shift .date { color: #a9b7c6; }
        .emp-shift .shift { color: #e0e0e0; font-weight: bold; }
        
        /* Unmatched Warning */
        .unmatched-card { border: 1px solid #ef6c00; }
        .unmatched-name { color: #ef6c00; }
        
        /* Diagnostic Box */
        .diagnostic-box { background: #331414; border: 1px solid #ff4444; padding: 15px; border-radius: 6px; margin-bottom: 20px; font-family: monospace; font-size: 13px; overflow-x: auto; display: none; }
    </style>
</head>
<body>

    <div class="top-nav">
        <button class="nav-btn active">📅 Schedule Generator</button>
        <button class="nav-btn" onclick="window.location.href='editor.html'">👥 Staff Editor</button>
    </div>

    <h1>Shift Scheduler Engine</h1>
    
    <div class="controls-container">
        <div class="form-group">
            <label>Start Date:</label>
            <input type="date" id="startDate" required>
        </div>
        <div class="form-group">
            <label>End Date:</label>
            <input type="date" id="endDate" required>
        </div>
        <button class="action-btn" onclick="generateSchedule()">Generate Schedule</button>
    </div>
    
    <div id="results">
        <div class="status-msg">Select dates and click Generate.</div>
    </div>

    <script>
        async function generateSchedule() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const resultsDiv = document.getElementById('results');

            if (!startDate || !endDate) {
                alert("Please select both a start and end date.");
                return;
            }

            resultsDiv.innerHTML = '<div class="status-msg">Fetching staff data from server and crunching the schedule...</div>';

            try {
                const staffResponse = await fetch('https://bombmud.vineyard.haus/api/staff');
                if (!staffResponse.ok) throw new Error("Failed to load staff data from server.");
                const employees = await staffResponse.json();
                
                const payload = {
                    start_date: startDate,
                    end_date: endDate,
                    employees: employees
                };

                const generateResponse = await fetch('https://bombmud.vineyard.haus/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await generateResponse.json();
                
                if (data.status === "success") {
                    renderSuccessInterface(data.schedule, employees);
                } else {
                    let errorMsg = `<strong>Error:</strong> ${data.message}\n\n`;
                    if (data.conflicts) errorMsg += "<strong>Conflicts:</strong>\n" + data.conflicts.join('\n') + "\n\n";
                    if (data.shortages) errorMsg += "<strong>Shortages:</strong>\n" + data.shortages.join('\n');
                    resultsDiv.innerHTML = `<div class="status-msg" style="color: #ff6b6b;">${errorMsg}</div>`;
                }
            } catch (error) {
                resultsDiv.innerHTML = `<div class="status-msg" style="color: #ff6b6b;">Error: ${error.message}</div>`;
            }
        }

        // --- HELPER: Aggressive Array Finder ---
        // Looks at a day object and finds whatever array holds the shifts, regardless of what Python named it
        function getShiftArrayFromDay(day) {
            if (day.shifts && Array.isArray(day.shifts)) return day.shifts;
            if (day.assignments && Array.isArray(day.assignments)) return day.assignments;
            if (day.workers && Array.isArray(day.workers)) return day.workers;
            
            // If all else fails, grab the first array found in the object
            for (const key in day) {
                if (Array.isArray(day[key])) return day[key];
            }
            return []; // Nothing found
        }

        function renderSuccessInterface(scheduleData, employees) {
            const resultsDiv = document.getElementById('results');
            
            // Generate HTML for both views
            const { html: employeeHTML, totalShiftsFound } = buildEmployeeRoster(scheduleData, employees);
            const calendarHTML = buildMasterCalendar(scheduleData);

            // Tripwire: Did we find absolutely nothing?
            let diagnosticHTML = '';
            if (totalShiftsFound === 0 && scheduleData.length > 0) {
                diagnosticHTML = `
                <div class="diagnostic-box" style="display: block;">
                    <strong style="color: #ff6b6b;">⚠️ CRITICAL: No shifts detected in the backend JSON payload.</strong><br>
                    <span style="color: #a9b7c6;">The Python backend returned this data for the very first day:</span><br><br>
                    <span style="color: #fff; white-space: pre-wrap;">${JSON.stringify(scheduleData[0], null, 2)}</span><br><br>
                    <strong style="color: #ff6b6b;">Please copy and paste this box back to me!</strong>
                </div>`;
            }

            resultsDiv.innerHTML = `
                ${diagnosticHTML}
                <div class="view-toggles">
                    <button class="toggle-btn active" id="btn-cal" onclick="switchView('cal')">Master Grid</button>
                    <button class="toggle-btn" id="btn-emp" onclick="switchView('emp')">Pay Period Breakdowns</button>
                </div>
                
                <div id="view-cal" class="tab-content active">
                    <div class="table-container">${calendarHTML}</div>
                </div>
                
                <div id="view-emp" class="tab-content">
                    ${employeeHTML}
                </div>
            `;
        }

        function switchView(view) {
            document.getElementById('btn-cal').classList.remove('active');
            document.getElementById('btn-emp').classList.remove('active');
            document.getElementById('view-cal').classList.remove('active');
            document.getElementById('view-emp').classList.remove('active');
            
            document.getElementById(`btn-${view}`).classList.add('active');
            document.getElementById(`view-${view}`).classList.add('active');
        }

        // --- View 1: Master Calendar ---
        function buildMasterCalendar(scheduleData) {
            const shiftNames = [];
            
            // Find unique shift names using aggressive key detection
            scheduleData.forEach(day => {
                const shiftList = getShiftArrayFromDay(day);
                
                shiftList.forEach(s => {
                    const shiftName = s.shift || s.shift_name || s.role || s.type || s.assignment || "Unknown Shift";
                    if (!shiftNames.includes(shiftName)) shiftNames.push(shiftName);
                });
            });

            let html = `<table>`;
            html += `<thead><tr><th>Shift</th>`;
            scheduleData.forEach(day => {
                const [year, month, d] = day.date.split('-');
                const dateObj = new Date(year, month - 1, d);
                const dateStr = dateObj.toLocaleDateString('en-US', { weekday: 'short', month: 'numeric', day: 'numeric' });
                html += `<th>${dateStr}</th>`;
            });
            html += `</tr></thead><tbody>`;

            shiftNames.forEach(targetShiftName => {
                html += `<tr>`;
                html += `<td class="shift-name">${targetShiftName}</td>`;
                
                scheduleData.forEach(day => {
                    const shiftList = getShiftArrayFromDay(day);
                    
                    // Find all workers assigned to this specific shift today
                    const assignedWorkers = shiftList.filter(s => {
                        const shiftName = s.shift || s.shift_name || s.role || s.type || s.assignment || "Unknown Shift";
                        return shiftName === targetShiftName;
                    });

                    if (assignedWorkers.length > 0) {
                        html += `<td class="assigned">`;
                        assignedWorkers.forEach(worker => {
                            const floatMarker = worker.is_float ? `<span class="float-tag">(F)</span>` : ``;
                            const workerName = worker.employee_name || worker.name || worker.employee || worker.worker || worker.staff || "Unknown";
                            html += `<div>${workerName}${floatMarker}</div>`;
                        });
                        html += `</td>`;
                    } else {
                        html += `<td></td>`;
                    }
                });
                html += `</tr>`;
            });
            html += `</tbody></table>`;
            return html;
        }

        // --- View 2: Individual Pay Period Cards ---
        function buildEmployeeRoster(scheduleData, employees) {
            const PAY_PERIOD_LENGTH = 14; 
            const numPayPeriods = Math.ceil(scheduleData.length / PAY_PERIOD_LENGTH);
            const ppRanges = [];
            let totalShiftsScraped = 0;
            
            // Safer date formatter (appends arbitrary time to prevent timezone shift)
            const formatShortDate = (dateStr) => {
                return new Date(dateStr + "T12:00:00").toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            };
            const formatFullDate = (dateStr) => {
                return new Date(dateStr + "T12:00:00").toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
            };
            
            // 1. Calculate the start/end dates for each pay period block
            for (let i = 0; i < numPayPeriods; i++) {
                const startDayIndex = i * PAY_PERIOD_LENGTH;
                const endDayIndex = Math.min((i + 1) * PAY_PERIOD_LENGTH - 1, scheduleData.length - 1);
                ppRanges.push({
                    label: `${formatShortDate(scheduleData[startDayIndex].date)} - ${formatShortDate(scheduleData[endDayIndex].date)}`,
                    daysInBlock: (endDayIndex - startDayIndex) + 1
                });
            }
            
            // 2. SCRAPE ALL SHIFTS using aggressive auto-detection
            const scrapedShifts = {};
            scheduleData.forEach((day, index) => {
                const ppIndex = Math.floor(index / PAY_PERIOD_LENGTH);
                const niceDate = formatFullDate(day.date);
                const shiftList = getShiftArrayFromDay(day);
                
                totalShiftsScraped += shiftList.length;

                shiftList.forEach(s => {
                    const rawName = s.employee_name || s.name || s.employee || s.worker || s.staff || s.staff_name || "Unknown Worker";
                    const shiftName = s.shift || s.shift_name || s.role || s.type || s.assignment || "Unknown Shift";
                    
                    if (!scrapedShifts[rawName]) scrapedShifts[rawName] = [];
                    
                    scrapedShifts[rawName].push({
                        ppIndex: ppIndex,
                        date: niceDate,
                        shift: shiftName,
                        is_float: s.is_float || false
                    });
                });
            });

            // Reusable function to build HTML for a single card
            const generateCardHTML = (empName, targetHoursBiweekly, shiftsArray, isUnmatched = false) => {
                const cardClass = isUnmatched ? "emp-card unmatched-card" : "emp-card";
                const nameClass = isUnmatched ? "emp-name unmatched-name" : "emp-name";
                
                let cardHtml = `<div class="${cardClass}"><div class="${nameClass}">${empName}</div>`;
                
                for (let i = 0; i < numPayPeriods; i++) {
                    const ppInfo = ppRanges[i];
                    const shiftsInPP = shiftsArray.filter(s => s.ppIndex === i);
                    
                    const expectedHours = Math.round((targetHoursBiweekly / 14) * ppInfo.daysInBlock);
                    
                    // ED Day is 12 hours, all others 10 hours
                    const actualHours = shiftsInPP.reduce((total, s) => {
                        return total + (s.shift.includes("ED Day") ? 12 : 10);
                    }, 0);
                    
                    let badgeClass = 'ok';
                    if (actualHours < expectedHours) badgeClass = 'short';
                    if (actualHours > expectedHours) badgeClass = 'over';
                    
                    cardHtml += `
                        <div class="pp-section">
                            <div class="pp-header">
                                <span>${ppInfo.label}</span>
                                <span class="hours-badge ${badgeClass}" title="Target: ${expectedHours} hrs">
                                    ${actualHours} / ${expectedHours} hrs
                                </span>
                            </div>`;
                    
                    if (shiftsInPP.length === 0) {
                        cardHtml += `<div class="emp-shift"><span class="date" style="font-style: italic; color: #666;">No shifts scheduled</span></div>`;
                    } else {
                        shiftsInPP.forEach(s => {
                            const floatMarker = s.is_float ? `<span class="float-tag" title="Float / Backup">(F)</span>` : ``;
                            cardHtml += `<div class="emp-shift">
                                        <span class="date">${s.date}</span>
                                        <span class="shift">${s.shift}${floatMarker}</span>
                                     </div>`;
                        });
                    }
                    cardHtml += `</div>`; 
                }
                cardHtml += `</div>`;
                return cardHtml;
            };

            let html = `<div class="emp-grid">`;
            
            // 3. Render known employees from the JSON master list
            const sortedEmployees = [...employees].sort((a, b) => a.name.localeCompare(b.name));
            
            sortedEmployees.forEach(emp => {
                let foundKey = null;
                
                if (scrapedShifts[emp.name]) {
                    foundKey = emp.name;
                } else {
                    foundKey = Object.keys(scrapedShifts).find(k => k.trim().toLowerCase() === emp.name.trim().toLowerCase());
                }

                const myShifts = foundKey ? scrapedShifts[foundKey] : [];
                if (foundKey) delete scrapedShifts[foundKey]; 
                
                html += generateCardHTML(emp.name, emp.target_hours || 80, myShifts, false);
            });
            
            // 4. THE CATCH-ALL: Render any shifts that didn't match a master employee
            Object.keys(scrapedShifts).forEach(leftoverName => {
                html += generateCardHTML(`${leftoverName} (Naming Mismatch)`, 80, scrapedShifts[leftoverName], true);
            });
            
            html += `</div>`;
            return { html, totalShiftsFound: totalShiftsScraped };
        }
    </script>
</body>
</html>
