<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Code Cart Inventory</title>
<style>
:root{
  --ink:#13262c; --soft:#5d7270; --paper:#eef1f0; --card:#fff;
  --rule:#cfd8d6; --hair:#e5e9e8; --teal:#0f6c6a;
  --red:#a32a20; --redbg:#fbe7e4; --amb:#8f5d0f; --ambbg:#fbf1dc; --ok:#2c6b45;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
 font:13px/1.35 "Helvetica Neue",-apple-system,system-ui,"Segoe UI",sans-serif;
 font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
.wrap{max-width:1100px;margin:0 auto;padding:0 10px}

.top{background:#0a4a49;color:#e8f3f1}
.top .wrap{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:5px 10px}
.top h1{margin:0;font-size:12.5px;font-weight:700;letter-spacing:-.01em}
.top .sp{flex:1}
.top input{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);
 color:#e8f3f1;border-radius:3px;padding:2px 5px;width:7ch;font-size:12px}
.top input::placeholder{color:#8bb0ac}
.top span.st{font-size:11.5px;color:#9cc0bc}
.tabs{display:flex;gap:2px}
.tab{border:0;background:rgba(255,255,255,.12);color:#cfe4e1;border-radius:3px;
 padding:3px 10px;font-size:12px;font-weight:600;cursor:pointer}
.tab[aria-selected=true]{background:#fff;color:#0a4a49}
.b{background:#fff;border:1px solid var(--rule);border-radius:3px;padding:3px 8px;
 font-size:12px;cursor:pointer;line-height:1.3}
.b:hover{background:#f2f5f4}
.b.p{background:var(--teal);border-color:var(--teal);color:#fff}
.b.p:hover{background:#0a4a49}

.bar{background:var(--card);border-bottom:1px solid var(--rule)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:6px 10px}
#soon{font-size:12.5px;min-width:0;flex:1 1 320px}
#soon b{font-weight:700}
#soon.r b,#soon.r i{color:var(--red)}
#soon.a b,#soon.a i{color:var(--amb)}
#soon i{font-style:normal;color:var(--soft)}
.k{font-size:12px;color:var(--soft);white-space:nowrap}
.k b{font-size:14px;color:var(--ink)}
.k.hot b{color:var(--red)}

main{padding:8px 10px 40px}
.kit{display:none}
.kit.on{display:block}
.bag{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:1100px;margin:0 auto;align-items:start}
.bay{background:var(--card);border:1px solid var(--rule);border-radius:3px}
.bay h2{margin:0;padding:4px 8px;border-bottom:1px solid var(--hair);
 font-size:11.5px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.bay h2 em{font-style:normal;font-weight:400;color:var(--soft)}
.sub{padding:2px 8px;background:#f4f7f6;border-bottom:1px solid var(--hair);border-top:1px solid var(--hair);
 font-size:10.5px;font-weight:700;color:var(--soft)}
.it{padding:4px 8px 5px;border-bottom:1px solid var(--hair);position:relative}
.it:last-child{border-bottom:0}
.it.r{background:var(--redbg)}
.it.a{background:var(--ambbg)}
.nm{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.nm b{font-size:12.5px;font-weight:600}
.nm b s{text-decoration:none;font-weight:400;color:var(--soft)}
.st2{font-size:11px;font-weight:700;color:var(--ok);white-space:nowrap}
.st2.r{color:var(--red)} .st2.a{color:var(--amb)} .st2.e{color:var(--soft);font-weight:400}
.lot{display:flex;gap:5px;margin-top:3px;align-items:center}
.q{width:44px;height:24px;text-align:center;border:1px solid var(--rule);border-radius:3px;padding:0 2px;background:#fff}
.dt{flex:1;min-width:0;height:24px;border:1px solid var(--rule);border-radius:3px;padding:0 5px;background:#fff;font-size:12px}
.dt::placeholder{color:#9aa8a6}
.dt.r{border-color:var(--red);color:var(--red);font-weight:600}
.dt.a{border-color:var(--amb);color:var(--amb);font-weight:600}
.na{flex:1;font-size:11px;color:var(--soft)}
.nt{margin:2px 0 0;font-size:11px;color:var(--soft)}

.cal{position:absolute;z-index:50;background:#fff;border:1px solid var(--rule);border-radius:4px;
 box-shadow:0 8px 22px rgba(10,34,32,.18);padding:5px;width:186px;user-select:none}
.cal .ch{display:flex;align-items:center;justify-content:space-between;padding:1px 2px 4px;font-size:11.5px;font-weight:700}
.cal .ch button{border:0;background:transparent;cursor:pointer;color:var(--soft);padding:0 5px;font-size:13px;line-height:1}
.cal .ch button:hover{color:var(--ink)}
.cal table{border-collapse:collapse;width:100%}
.cal th{font-size:9.5px;font-weight:600;color:var(--soft);padding:0 0 2px}
.cal td{padding:0}
.cal td div{text-align:center;font-size:11px;padding:2.5px 0;border-radius:2px;cursor:pointer}
.cal td div:hover{background:#e6efee}
.cal .eom{background:#dcebe9;font-weight:700;color:#0a4a49}
.cal .sel{background:var(--teal);color:#fff;font-weight:700}
.cal .tdy{box-shadow:inset 0 0 0 1px var(--soft)}
.cal .ft{font-size:10px;color:var(--soft);padding:3px 2px 0;text-align:center}

dialog{border:1px solid var(--rule);border-radius:4px;padding:0;width:min(640px,94vw);background:#fff;color:var(--ink)}
dialog::backdrop{background:rgba(10,34,32,.4)}
.rt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid var(--rule)}
.rt h2{margin:0;font-size:13px}
.rb{padding:8px 10px 12px;max-height:72vh;overflow:auto;font-size:12.5px}
.rb h3{margin:10px 0 3px;font-size:12px}
.rb h3:first-of-type{margin-top:4px}
.rb ul{margin:0;padding:0;list-style:none}
.rb li{display:flex;justify-content:space-between;gap:10px;padding:2.5px 0;border-bottom:1px solid var(--hair)}
.rb li s{text-decoration:none;color:var(--soft);font-size:11px}
.rb li span:last-child{flex:none;font-weight:700}
.rb p{margin:2px 0;color:var(--soft);font-size:11.5px}
.due{color:var(--red)} .sn{color:var(--amb)}

.foot{max-width:1100px;margin:8px auto 0;padding:0 10px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.foot em{margin-left:auto;font-style:normal;font-size:11px;color:var(--soft)}

@media(max-width:900px){.bag{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.bag{grid-template-columns:1fr}}
@media print{.top,.bar,main,.foot{display:none}dialog{border:0}.rt .b{display:none}.rb{max-height:none}}
</style>
</head>
<body>

<div class="top"><div class="wrap">
  <h1>Salem Health · code inventory</h1>
  <div class="tabs" id="tabs" role="tablist"></div>
  <span class="st" id="when">not checked</span>
  <span class="sp"></span>
  <input id="who" placeholder="init" maxlength="6" tabindex="-1">
  <button class="b" id="sign" tabindex="-1">Sign off</button>
  <button class="b p" id="open" tabindex="-1">Report</button>
</div></div>

<div class="bar"><div class="wrap">
  <div id="soon"></div>
  <div class="k" id="kr">restock <b>0</b></div>
  <div class="k" id="ke">expired <b>0</b></div>
</div></div>

<main id="main"></main>

<div class="foot">
  <button class="b" id="exp" tabindex="-1">Export</button>
  <button class="b" id="imp" tabindex="-1">Import</button>
  <input type="file" id="file" accept="application/json" hidden>
  <button class="b" id="clr" tabindex="-1">Clear this tab</button>
  <em id="saved"></em>
</div>

<dialog id="rep">
  <div class="rt"><h2 id="rh">Restock report</h2>
    <div><button class="b" id="prt">Print</button> <button class="b" id="cls">Close</button></div>
  </div>
  <div class="rb" id="rb"></div>
</dialog>

<script>
const N=false; /* dated:false shorthand */
const KITS=[
{id:'bp',label:'Backpack',title:'Code Backpack',bays:[
 {bay:'Right tray',where:'inside',s:[{items:[
  {id:'epi',name:'Epinephrine 1:10,000',dose:'1 mg/10 mL',par:12}]}]},
 {bay:'Left tray',where:'inside',s:[{items:[
  {id:'lido',name:'Lidocaine 2%',dose:'100 mg/5 mL',par:3},
  {id:'atro',name:'Atropine',dose:'1 mg/10 mL adult',par:3},
  {id:'cacl',name:'Calcium chloride 10%',dose:'1 gm/10 mL',par:2},
  {id:'fl',name:'NaCl flush',dose:'10 mL',par:10,note:'Par 10 or more.'}]}]},
 {bay:'Right pocket',where:'outside',s:[{items:[
  {id:'tub',name:'Continu-Flo set',dose:'primary tubing',par:3,dated:N}]}]},
 {bay:'Left pocket',where:'outside',s:[{items:[
  {id:'dop',name:'Dopamine',dose:'400 mg/250 mL',par:1},
  {id:'levo',name:'Norepinephrine',dose:'8 mg/250 mL',par:1,note:'Or supplies to mix.'}]}]},
 {bay:'Center slot',where:'bottom',s:[{items:[
  {id:'bic',name:'Sodium bicarb 8.4%',dose:'50 mEq/50 mL',par:5},
  {id:'d50',name:'Dextrose 50%',dose:'25 gm/50 mL',par:1},
  {id:'d5w',name:'D5W',dose:'250 mL',par:1}]}]}
]},
{id:'tb',label:'Tackle box',title:'Code Box (tackle box)',bays:[
 {bay:'Top shelf',where:'',s:[
  {label:'Medications',items:[
   {id:'aden',name:'Adenosine',dose:'6 mg/2 mL',par:6},
   {id:'amio',name:'Amiodarone',dose:'150 mg/3 mL',par:3},
   {id:'epi1',name:'Epinephrine',dose:'1 mg/mL',par:4},
   {id:'etom',name:'Etomidate',dose:'40 mg/20 mL',par:2},
   {id:'flum',name:'Flumazenil',dose:'0.5 mg/5 mL',par:1},
   {id:'mag',name:'Magnesium sulfate 50%',dose:'1 gm/2 mL',par:4}]},
  {label:'Supplies',items:[
   {id:'swab',name:'Alcohol swabs',dose:'',par:20,note:'Par 20 or more.'},
   {id:'filtn',name:'Filter needles',dose:'',par:5},
   {id:'ndl',name:'Needles',dose:'16 to 20 gauge',par:10,note:'Par 10–15.'},
   {id:'blunt',name:'Blunt tip needles',dose:'',par:10,note:'Par 10–15.'},
   {id:'adapt',name:'Syringe transfer adaptors',dose:'',par:5},
   {id:'band',name:'Rubber bands',dose:'',par:10,dated:N,note:'Par 10 or more.'},
   {id:'blank',name:'Blank labels',dose:'',par:10,dated:N,note:'Par 10 or more.'}]}]},
 {bay:'Middle shelf',where:'',s:[
  {label:'Medications',items:[
   {id:'mpred',name:'Methylprednisolone',dose:'125 mg',par:1},
   {id:'nlx',name:'Naloxone',dose:'4 mg/10 mL',par:1},
   {id:'pfns',name:'Preservative-free NS',dose:'10 mL vials',par:2},
   {id:'phen',name:'Phenylephrine',dose:'100 mcg/mL 10 mL syringe',par:1},
   {id:'sux',name:'Succinylcholine',dose:'100 mg/10 mL syringes',par:2},
   {id:'roc',name:'Rocuronium',dose:'50 mg/5 mL',par:4,note:'Out of the fridge, good 60 days. Date it the earlier of the two.'}]},
  {label:'Supplies',items:[
   {id:'pen',name:'Pen',dose:'',par:2,dated:N},
   {id:'calc',name:'Calculator',dose:'',par:1,dated:N},
   {id:'acls',name:'ACLS book',dose:'',par:1,dated:N},
   {id:'bros',name:'Broselow tape et al',dose:'',par:1,dated:N},
   {id:'labels',name:'Premade infusion labels',dose:'epinephrine & phenylephrine, 2 of each',par:2,dated:N,note:'Reprint from the code boxes folder in Teams.'},
   {id:'n22',name:'22 gauge 1½ inch needle',dose:'',par:1},
   {id:'n23',name:'23 gauge 1 inch needle',dose:'',par:1}]}]},
 {bay:'Bottom shelf',where:'',s:[
  {label:'Medications',items:[
   {id:'prop',name:'Propofol',dose:'1000 mg/100 mL vials',par:1}]},
  {label:'Supplies',items:[
   {id:'s60',name:'60 mL syringe',dose:'for alteplase',par:1},
   {id:'s20',name:'20 mL syringes',dose:'',par:4},
   {id:'s10',name:'10 or 12 mL syringes',dose:'',par:8,note:'Par 8–10.'},
   {id:'s5',name:'5 mL syringes',dose:'',par:5,note:'Par 5–10.'},
   {id:'s3',name:'3 mL syringes',dose:'',par:5,note:'Par 5–10.'},
   {id:'s1',name:'1 mL syringes',dose:'',par:15,note:'Par 15–20.'},
   {id:'nsfl',name:'NS flush syringes',dose:'',par:5,note:'Par 5–10.'},
   {id:'cap',name:'Red caps',dose:'',par:10,dated:N,note:'Par 10–15.'},
   {id:'filt',name:'0.2 micron filter',dose:'',par:1}]}]}
]}];

/* ---- storage ---- */
const KEY='salem-code-inv-v1';let mem=null;
const rd=()=>{try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):mem}catch(e){return mem}};
const wr=v=>{mem=v;try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}};
const blank=()=>({c:{},who:'',when:{}});
let S=Object.assign(blank(),rd()||{});
if(!S.c)S.c={}; if(!S.when||typeof S.when!=='object')S.when={};
const C=it=>S.c[it.kit+':'+it.id]||(S.c[it.kit+':'+it.id]={q:'',e:''});
let KIT=KITS[0];

/* ---- dates ---- */
const t0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const pd=s=>{if(!s)return null;const d=new Date(s+'T00:00:00');return isNaN(d)?null:d};
const dz=s=>{const d=pd(s);return d===null?null:Math.round((d-t0())/864e5)};
const iso=(y,m,d)=>y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
const eom=(y,m)=>new Date(y,m,0).getDate();
const show=s=>{const d=pd(s);return d?String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0')+'/'+String(d.getFullYear()).slice(2):''};
const nice=s=>{const d=pd(s);return d?d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'2-digit'}):'—'};
const cd=n=>n===null?'':n<0?'expired '+(-n)+'d ago':n===0?'expires today':n+'d left';
function guess(g){const now=new Date(),cy=now.getFullYear();
 let m=parseInt(g.slice(0,2)||'0',10);if(g.length===1)m=parseInt(g,10);
 if(!(m>=1&&m<=12))m=now.getMonth()+1;
 let y=cy,d=null;
 if(g.length===3||g.length===4){const n=parseInt(g.slice(2),10),yy=2000+n;
  if(g.length===4&&yy>=cy){y=yy}else{d=n;y=cy}}
 else if(g.length===5){d=parseInt(g.slice(2,4),10);y=2020+parseInt(g.slice(4),10)}
 else if(g.length===6){d=parseInt(g.slice(2,4),10);y=2000+parseInt(g.slice(4),10)}
 else if(g.length>=7){d=parseInt(g.slice(2,4),10);y=parseInt((g.slice(4)+'0000').slice(0,4),10)}
 if(d!==null&&(d<1||d>eom(y,m)))d=null;
 if(y<cy-1||y>cy+30)y=cy;
 return{y:y,m:m,d:d}}
function commit(g){if(!g)return'';
 const now=new Date();
 if(g.length<=2){const m=parseInt(g,10);if(!(m>=1&&m<=12))return'';
  let y=now.getFullYear();if(new Date(y,m,0)<t0())y++;return iso(y,m,eom(y,m))}
 const v=guess(g);
 return v.d===null?iso(v.y,v.m,eom(v.y,v.m)):iso(v.y,v.m,v.d)}
const digitsFrom=e=>{const d=pd(e);return d?String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+String(d.getFullYear()).slice(2):''};

/* ---- math ---- */
function A(it){const c=C(it),counted=c.q!==''&&c.q!=null,q=parseInt(c.q,10)||0;
 const d=it.dated===false?null:dz(c.e);
 const x=(d!==null&&d<0)?q:0,u=x?0:q;
 return{counted:counted,q:q,u:u,x:x,short:Math.max(0,it.par-u),d:d,e:c.e}}

/* ---- build both kits ---- */
const main=document.getElementById('main'),tabs=document.getElementById('tabs');
KITS.forEach((k,ki)=>{
 const t=document.createElement('button');
 t.className='tab';t.type='button';t.role='tab';t.textContent=k.label;
 t.setAttribute('aria-selected',ki===0);t.tabIndex=-1;
 t.onclick=()=>swap(k);tabs.appendChild(t);k.tab=t;

 const pane=document.createElement('div');pane.className='kit'+(ki===0?' on':'');
 const grid=document.createElement('div');grid.className='bag';
 k.bays.forEach(b=>{
  const sec=document.createElement('section');sec.className='bay';
  sec.innerHTML='<h2>'+b.bay+'<em>'+(b.where||'')+'</em></h2>';
  b.s.forEach(g=>{
   if(g.label){const h=document.createElement('div');h.className='sub';h.textContent=g.label;sec.appendChild(h)}
   g.items.forEach(i=>{i.kit=k.id;i.bay=b.bay;sec.appendChild(row(i))});
  });
  grid.appendChild(sec)});
 pane.appendChild(grid);main.appendChild(pane);k.pane=pane;
});
const items=k=>k.bays.flatMap(b=>b.s.flatMap(g=>g.items));

function swap(k){KIT=k;
 KITS.forEach(x=>{x.pane.classList.toggle('on',x===k);x.tab.setAttribute('aria-selected',x===k)});
 stamp();sum()}

function row(it){const c=C(it);
 const el=document.createElement('div');el.className='it';el.dataset.i=it.kit+':'+it.id;
 el.innerHTML='<div class="nm"><b>'+it.name+(it.dose?' <s>'+it.dose+'</s>':'')+'</b><span class="st2"></span></div>'
  +'<div class="lot"><input class="q" inputmode="numeric" value="'+(c.q||'')+'" aria-label="count '+it.name+'">'
  +(it.dated===false?'<span class="na">no expiration</span>'
    :'<input class="dt" inputmode="numeric" autocomplete="off" placeholder="mm/yy" value="'+show(c.e)+'" aria-label="expiration '+it.name+'">')
  +'</div>'+(it.note?'<p class="nt">'+it.note+'</p>':'');

 const q=el.querySelector('.q');
 q.addEventListener('input',()=>{q.value=q.value.replace(/\D/g,'').slice(0,3);c.q=q.value;up(it);save()});
 q.addEventListener('focus',()=>q.select());
 q.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();nextField(q)}});

 const dt=el.querySelector('.dt');
 if(dt){let g='';
  const open=()=>cal.open(dt,guess(g||digitsFrom(c.e)),v=>{c.e=v;dt.value=show(v);g='';up(it);save();cal.close();dt.focus()});
  dt.addEventListener('focus',()=>{g='';dt.select();open()});
  dt.addEventListener('input',()=>{g=dt.value.replace(/\D/g,'').slice(0,8);
   dt.value=g.length<=2?g:g.length<=4?g.slice(0,2)+'/'+g.slice(2):g.slice(0,2)+'/'+g.slice(2,4)+'/'+g.slice(4);open()});
  dt.addEventListener('blur',()=>{if(g){c.e=commit(g);g=''}dt.value=show(c.e);up(it);save();cal.close()});
  dt.addEventListener('keydown',e=>{
   if(e.key==='Escape'){cal.close();dt.blur()}
   if(e.key==='Enter'){e.preventDefault();dt.blur();nextField(dt)}});
 }
 return el}
function nextField(el){const f=[...KIT.pane.querySelectorAll('.q,.dt')];const i=f.indexOf(el);if(i>-1&&f[i+1])f[i+1].focus()}

/* ---- calendar ---- */
const cal=(function(){let box=null,view=null,cb=null;
 function close(){if(box){box.remove();box=null}}
 function open(input,v,onPick){cb=onPick;
  if(!box){box=document.createElement('div');box.className='cal';
   box.addEventListener('mousedown',e=>e.preventDefault());document.body.appendChild(box)}
  view={y:v.y,m:v.m,d:v.d};render();
  const r=input.getBoundingClientRect(),h=box.offsetHeight,below=window.innerHeight-r.bottom;
  box.style.left=Math.min(r.left+window.scrollX,window.scrollX+document.documentElement.clientWidth-196)+'px';
  box.style.top=(below<h+8?r.top+window.scrollY-h-4:r.bottom+window.scrollY+4)+'px'}
 function render(){const y=view.y,m=view.m,last=eom(y,m),first=new Date(y,m-1,1).getDay(),now=t0(),sel=view.d;
  let cells='';for(let i=0;i<first;i++)cells+='<td></td>';
  for(let d=1;d<=last;d++){
   if((first+d-1)%7===0&&d>1)cells+='</tr><tr>';
   const isT=now.getFullYear()===y&&now.getMonth()===m-1&&now.getDate()===d;
   const c=[d===last?'eom':'',d===sel?'sel':'',isT?'tdy':''].filter(Boolean).join(' ');
   cells+='<td><div class="'+c+'" data-d="'+d+'">'+d+'</div></td>'}
  box.innerHTML='<div class="ch"><button data-s="-1">&lsaquo;</button>'
   +new Date(y,m-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'})
   +'<button data-s="1">&rsaquo;</button></div>'
   +'<table><tr><th>S</th><th>M</th><th>T</th><th>W</th><th>T</th><th>F</th><th>S</th></tr><tr>'
   +cells+'</tr></table><div class="ft">last day of month '+last+'</div>';
  box.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{let m2=view.m+ +b.dataset.s,y2=view.y;
   if(m2<1){m2=12;y2--}if(m2>12){m2=1;y2++}view={y:y2,m:m2,d:null};render()});
  box.querySelectorAll('[data-d]').forEach(c=>c.onclick=()=>cb(iso(view.y,view.m,+c.dataset.d)))}
 window.addEventListener('scroll',close,true);
 return{open:open,close:close}})();

/* ---- status ---- */
function up(it){const el=main.querySelector('[data-i="'+it.kit+':'+it.id+'"]'),a=A(it),st=el.querySelector('.st2');
 let t,c='st2';
 if(!a.counted&&!a.e){t='—';c='st2 e'}
 else if(a.x>0){t=a.x+' expired · pull '+it.par;c='st2 r'}
 else if(a.counted&&a.q===0){t='none here · pull '+it.par;c='st2 r'}
 else if(a.short>0){t=a.u+'/'+it.par+' · add '+a.short;c='st2 r'}
 else{t=a.u+'/'+it.par;if(a.d!==null&&a.d<=30){t+=' · '+cd(a.d);c='st2 a'}}
 st.textContent=t;st.className=c;
 el.className='it'+((a.counted&&a.short>0)||a.x>0?' r':(a.d!==null&&a.d<=30?' a':''));
 const dt=el.querySelector('.dt');
 if(dt){dt.classList.toggle('r',a.d!==null&&a.d<0);dt.classList.toggle('a',a.d!==null&&a.d>=0&&a.d<=30)}
 sum()}

function sum(){let r=0,x=0,best=null,tied=[];
 items(KIT).forEach(it=>{const a=A(it);
  if(a.counted&&a.short>0)r++;x+=a.x;
  if(!a.e||a.d===null)return;
  if(best===null||a.d<best.d){best={d:a.d,e:a.e};tied=[it]}
  else if(a.d===best.d)tied.push(it)});
 const e=document.getElementById('soon');
 if(!best){e.className='';e.textContent='Count, tab, then type the date as 08 27 or 08 31 27.'}
 else{e.className=best.d<0?'r':best.d<=30?'a':'';
  e.innerHTML=(tied.length>1?'First to expire ('+tied.length+' tied): ':'First to expire: ')
   +tied.map(it=>'<b>'+it.name+'</b> <i>'+it.bay+'</i>').join(', ')
   +' <i>· '+nice(best.e)+' · '+cd(best.d)+'</i>'}
 const kr=document.getElementById('kr'),ke=document.getElementById('ke');
 kr.innerHTML='restock <b>'+r+'</b>';kr.className='k'+(r?' hot':'');
 ke.innerHTML='expired <b>'+x+'</b>';ke.className='k'+(x?' hot':'')}

let tid;function save(){clearTimeout(tid);tid=setTimeout(()=>{wr(S);
 document.getElementById('saved').textContent='saved '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})},250)}

/* ---- report ---- */
const dlg=document.getElementById('rep');
document.getElementById('open').onclick=()=>{build();dlg.showModal()};
document.getElementById('cls').onclick=()=>dlg.close();
document.getElementById('prt').onclick=()=>window.print();
function build(){const o=[],ds=[],un=[];
 items(KIT).forEach(it=>{const a=A(it);
  if(!a.counted&&!a.e){un.push(it);return}
  if(a.short>0)o.push({it:it,a:a});
  if(a.q&&a.e)ds.push({it:it,q:a.q,e:a.e,d:a.d})});
 ds.sort((a,b)=>a.d-b.d);
 const li=(m,s,x)=>'<li><span>'+m+(x?' <s>'+x+'</s>':'')+'</span><span>'+s+'</span></li>';
 document.getElementById('rh').textContent=KIT.title+' — restock report';
 let h='<p>'+(S.who||S.when[KIT.id]?'Checked by '+(S.who||'—')+' · '+(S.when[KIT.id]||'—'):'Not signed off')
  +' · printed '+new Date().toLocaleString([],{dateStyle:'short',timeStyle:'short'})+'</p>';
 h+='<h3>Restock</h3>'+(o.length?'<ul>'+o.map(v=>li(v.it.name+(v.it.dose?' '+v.it.dose:''),
   (v.a.q===0||v.a.x>0?'pull '+v.it.par:'add '+v.a.short),
   v.it.bay+' · '+v.a.u+'/'+v.it.par+(v.a.x?' · discard '+v.a.x+' expired':''))).join('')+'</ul>'
   :'<p>All counted items at par.</p>');
 h+='<h3>By expiration</h3>'+(ds.length?'<ul>'+ds.map(d=>li(d.it.name+(d.it.dose?' '+d.it.dose:''),
   '<span class="'+(d.d<0?'due':d.d<=30?'sn':'')+'">'+nice(d.e)+'</span>',
   d.it.bay+' · '+d.q+' ea · '+cd(d.d))).join('')+'</ul>':'<p>No dates entered.</p>');
 if(un.length)h+='<h3>Not counted</h3><ul>'+un.map(i=>li(i.name+(i.dose?' '+i.dose:''),'',i.bay)).join('')+'</ul>';
 document.getElementById('rb').innerHTML=h}

/* ---- misc ---- */
const who=document.getElementById('who');who.value=S.who||'';
who.oninput=()=>{S.who=who.value;save()};
function stamp(){document.getElementById('when').textContent=S.when[KIT.id]?'checked '+S.when[KIT.id]:'not checked'}
document.getElementById('sign').onclick=()=>{S.when[KIT.id]=new Date().toLocaleString([],{dateStyle:'short',timeStyle:'short'});stamp();save()};
document.getElementById('exp').onclick=()=>{const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);
 a.download='code-inventory-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)};
document.getElementById('imp').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();
 fr.onload=()=>{try{const n=JSON.parse(fr.result);if(!n||!n.c)throw 0;
  S=Object.assign(blank(),n);wr(S);location.reload()}catch(x){alert('Not a backup file from this page.')}};
 fr.readAsText(f);e.target.value=''};
document.getElementById('clr').onclick=()=>{if(!confirm('Clear all counts and dates on the '+KIT.label+' tab?'))return;
 items(KIT).forEach(it=>delete S.c[it.kit+':'+it.id]);delete S.when[KIT.id];wr(S);location.reload()};

stamp();KITS.forEach(k=>items(k).forEach(up));sum();
</script>
</body>
</html>
