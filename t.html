<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avalon Tides</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --high-tide: #0284c7;
            --low-tide: #ea580c;
            --border: #e2e8f0;
            --primary: #0ea5e9;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.02em;
        }
        .header p {
            margin: 0.5rem 0 0 0;
            color: var(--text-muted);
            font-size: 1.1rem;
        }
        
        /* Tabs */
        .tabs {
            display: flex;
            gap: 0.5rem;
            background: var(--card-bg);
            padding: 0.5rem;
            border-radius: 99px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 2rem;
            border: 1px solid var(--border);
            position: sticky;
            top: 1rem;
            z-index: 50;
            flex-wrap: wrap;
            justify-content: center;
        }
        .tab-btn {
            padding: 0.75rem 1.5rem;
            border-radius: 99px;
            border: none;
            background: transparent;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 4px rgba(14, 165, 233, 0.3);
        }
        .tab-btn:hover:not(.active) {
            background: #f1f5f9;
        }

        .view-container {
            width: 100%;
            max-width: 600px;
            display: none;
            flex-direction: column;
            gap: 1.5rem;
        }
        .view-container.active {
            display: flex;
        }

        /* 7-Day View */
        .day-card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .day-header {
            background: #f1f5f9;
            padding: 1rem 1.5rem;
            font-weight: 600;
            color: #334155;
            border-bottom: 1px solid var(--border);
            font-size: 1.1rem;
        }
        .day-card.today {
            border: 2px solid #38bdf8;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .day-card.today .day-header {
            background: var(--primary);
            color: white;
            border-bottom: none;
        }
        .tide-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid var(--border);
        }
        .tide-row:last-child {
            border-bottom: none;
        }
        .tide-info {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }
        .tide-type {
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            width: 60px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .tide-type.high { color: var(--high-tide); }
        .tide-type.low { color: var(--low-tide); }
        .tide-time {
            font-size: 1.2rem;
            font-weight: 500;
            color: var(--text-main);
        }
        .tide-height {
            font-size: 1.2rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        
        /* Long-Term View */
        #monthly-view {
            max-width: 800px;
        }
        .month-section { margin-bottom: 3rem; }
        .month-label {
            position: sticky;
            top: 5rem; 
            background: rgba(248, 250, 252, 0.95);
            backdrop-filter: blur(8px);
            padding: 1rem 0;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
            z-index: 10;
            border-bottom: 2px solid var(--border);
            margin-bottom: 1rem;
        }
        .compact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 0.5rem;
        }
        .mini-day {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.5rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        .mini-day.today {
            border: 2px solid #38bdf8;
            background: #f0f9ff;
        }
        .mini-day-header {
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--text-main);
            text-align: center;
            padding-bottom: 0.25rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 0.25rem;
        }
        .mini-tide {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        .mini-tide.high { color: var(--high-tide); }
        .mini-tide.low { color: var(--low-tide); }

        /* Graph View Updated */
        #graph-view {
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
        }
        .graph-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .graph-header h3 {
            margin: 0;
            font-size: 1.5rem;
            color: #0f172a;
        }
        .graph-header p {
            margin: 0.25rem 0 0 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        .chart-wrapper {
            position: relative;
            height: 400px; /* Fixed height forces chart.js to fill correctly */
            width: 100%;
        }

        #loader, #graph-loader {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            font-size: 1.1rem;
            width: 100%;
        }
        .error {
            color: #ef4444;
            background: #fef2f2;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            width: 100%;
            max-width: 600px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Avalon Tides</h1>
        <p>Catalina Island, California</p>
    </div>

    <div class="tabs" id="tabs" style="display: none;">
        <button class="tab-btn active" onclick="switchTab('weekly')">7-Day View</button>
        <button class="tab-btn" onclick="switchTab('monthly')">Long-Term View</button>
        <button class="tab-btn" onclick="switchTab('graph')">48-Hour Graph</button>
    </div>

    <div id="loader">Fetching tide data...</div>
    <div id="error-container"></div>

    <div id="weekly-view" class="view-container"></div>
    <div id="monthly-view" class="view-container"></div>

    <div id="graph-view" class="view-container">
        <div class="graph-header">
            <h3>48-Hour Trajectory</h3>
            <p>Live predictive water levels (MLLW)</p>
        </div>
        <div id="graph-loader" style="display:none;">Rendering telemetry...</div>
        <div class="chart-wrapper">
            <canvas id="tideChart"></canvas>
        </div>
    </div>

    <script>
        const station = "9410079";
        let allHiLoTides = []; 
        let graphDataLoaded = false;
        let tideChartInstance = null;
        let currentNowIndex = null;

        const todayStrLocal = getLocalTodayStr();

        function getLocalTodayStr() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        function formatDateForAPI(date) {
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            return `${yyyy}${mm}${dd}`;
        }

        async function init() {
            const localNow = new Date();
            const endDate = new Date(localNow);
            endDate.setFullYear(localNow.getFullYear() + 1); 

            const url = `https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?begin_date=${formatDateForAPI(localNow)}&end_date=${formatDateForAPI(endDate)}&station=${station}&product=predictions&datum=MLLW&time_zone=lst_ldt&interval=hilo&units=english&format=json`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                if (data.error) throw new Error(data.error.message);
                
                allHiLoTides = data.predictions;
                
                document.getElementById('loader').style.display = 'none';
                document.getElementById('tabs').style.display = 'flex';
                
                renderWeekly();
                renderAllMonths();
                document.getElementById('weekly-view').classList.add('active');

            } catch (error) {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('error-container').innerHTML = `<div class="error">Unable to load tide data. Please try again later.</div>`;
            }
        }

        function switchTab(viewId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            document.querySelectorAll('.view-container').forEach(view => view.classList.remove('active'));
            document.getElementById(viewId + '-view').classList.add('active');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });

            if (viewId === 'graph' && !graphDataLoaded) {
                loadGraphData();
            }
        }

        // --- GRAPH VIEW LOGIC ---

        // Custom Chart.js Plugin to draw the "NOW" vertical line
        const currentTimePlugin = {
            id: 'currentTime',
            afterDraw: (chart) => {
                if (currentNowIndex !== null && currentNowIndex !== undefined) {
                    const ctx = chart.ctx;
                    const xAxis = chart.scales.x;
                    const yAxis = chart.scales.y;
                    const x = xAxis.getPixelForTick(currentNowIndex);
                    
                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(x, yAxis.top);
                    ctx.lineTo(x, yAxis.bottom);
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#ef4444'; // Red Dashed Line
                    ctx.setLineDash([6, 6]);
                    ctx.stroke();
                    
                    // "NOW" Label Box
                    ctx.fillStyle = '#ef4444';
                    ctx.fillRect(x - 25, yAxis.top - 12, 50, 20);
                    ctx.fillStyle = '#ffffff';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.font = 'bold 10px sans-serif';
                    ctx.fillText('NOW', x, yAxis.top - 2);
                    ctx.restore();
                }
            }
        };

        async function loadGraphData() {
            const loader = document.getElementById('graph-loader');
            loader.style.display = 'block';

            const localNow = new Date();
            const endDate = new Date(localNow);
            endDate.setDate(localNow.getDate() + 2); 

            const url = `https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?begin_date=${formatDateForAPI(localNow)}&end_date=${formatDateForAPI(endDate)}&station=${station}&product=predictions&datum=MLLW&time_zone=lst_ldt&units=english&format=json`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data.error) throw new Error(data.error.message);
                
                const labels = [];
                const values = [];
                
                const nowTime = new Date();
                let minDiff = Infinity;

                data.predictions.forEach((item, index) => {
                    const timePart = item.t.split(" ")[1];
                    labels.push(formatMiniTime(timePart));
                    values.push(parseFloat(item.v));

                    // Calculate which data point is closest to right now
                    // Replace dashes with slashes for universal browser support
                    const itemDate = new Date(item.t.replace(/-/g, '/'));
                    const diff = Math.abs(nowTime - itemDate);
                    if (diff < minDiff) {
                        minDiff = diff;
                        currentNowIndex = index;
                    }
                });

                renderChart(labels, values);
                graphDataLoaded = true;
                loader.style.display = 'none';

            } catch (error) {
                loader.innerHTML = `<div class="error">Unable to load graph data.</div>`;
            }
        }

        function renderChart(labels, dataPoints) {
            const ctx = document.getElementById('tideChart').getContext('2d');
            
            // Rich Gradient Fill
            const fillGradient = ctx.createLinearGradient(0, 0, 0, 400);
            fillGradient.addColorStop(0, 'rgba(2, 132, 199, 0.6)');
            fillGradient.addColorStop(0.5, 'rgba(14, 165, 233, 0.2)');
            fillGradient.addColorStop(1, 'rgba(234, 88, 12, 0.1)');

            // Scan data for exact Highs and Lows to plot specific dots
            const pointRadii = [];
            const pointColors = [];
            
            for(let i=0; i<dataPoints.length; i++) {
                if(i === 0 || i === dataPoints.length - 1) {
                    pointRadii.push(0); pointColors.push('transparent'); continue;
                }
                const prev = dataPoints[i-1];
                const curr = dataPoints[i];
                const next = dataPoints[i+1];
                
                if (curr > prev && curr > next) { // High Tide Peak
                    pointRadii.push(5);
                    pointColors.push('#0284c7');
                } else if (curr < prev && curr < next) { // Low Tide Valley
                    pointRadii.push(5);
                    pointColors.push('#ea580c');
                } else { // Standard Line
                    pointRadii.push(0);
                    pointColors.push('transparent');
                }
            }

            if(tideChartInstance) tideChartInstance.destroy();

            tideChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Water Level',
                        data: dataPoints,
                        borderColor: '#0ea5e9',
                        backgroundColor: fillGradient,
                        borderWidth: 3,
                        pointRadius: pointRadii,
                        pointBackgroundColor: pointColors,
                        pointBorderColor: '#ffffff',
                        pointBorderWidth: 2,
                        pointHitRadius: 15, // Large invisible hit area for easy tooltips
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: { padding: { top: 20 } },
                    interaction: {
                        intersect: false,
                        mode: 'index',
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(15, 23, 42, 0.95)',
                            titleColor: '#94a3b8',
                            titleFont: { size: 13, weight: 'normal' },
                            bodyFont: { size: 16, weight: 'bold
