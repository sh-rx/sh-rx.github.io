<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avalon Tides</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --high-tide: #0284c7;
            --low-tide: #ea580c;
            --border: #e2e8f0;
            --primary: #0ea5e9;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.02em;
        }
        .header p {
            margin: 0.5rem 0 0 0;
            color: var(--text-muted);
            font-size: 1.1rem;
        }
        
        /* Tabs Styling */
        .tabs {
            display: flex;
            gap: 0.5rem;
            background: var(--card-bg);
            padding: 0.5rem;
            border-radius: 99px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 2rem;
            border: 1px solid var(--border);
            position: sticky;
            top: 1rem;
            z-index: 50;
            flex-wrap: wrap;
            justify-content: center;
        }
        .tab-btn {
            padding: 0.75rem 1.5rem;
            border-radius: 99px;
            border: none;
            background: transparent;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 4px rgba(14, 165, 233, 0.3);
        }
        .tab-btn:hover:not(.active) {
            background: #f1f5f9;
        }

        /* View Containers */
        .view-container {
            width: 100%;
            max-width: 600px;
            display: none;
            flex-direction: column;
            gap: 1.5rem;
        }
        .view-container.active {
            display: flex;
        }

        /* 7-Day View Cards */
        .day-card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .day-header {
            background: #f1f5f9;
            padding: 1rem 1.5rem;
            font-weight: 600;
            color: #334155;
            border-bottom: 1px solid var(--border);
            font-size: 1.1rem;
        }
        .day-card.today {
            border: 2px solid #38bdf8;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .day-card.today .day-header {
            background: var(--primary);
            color: white;
            border-bottom: none;
        }
        .tide-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid var(--border);
        }
        .tide-row:last-child {
            border-bottom: none;
        }
        .tide-info {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }
        .tide-type {
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            width: 60px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .tide-type.high { color: var(--high-tide); }
        .tide-type.low { color: var(--low-tide); }
        .tide-time {
            font-size: 1.2rem;
            font-weight: 500;
            color: var(--text-main);
        }
        .tide-height {
            font-size: 1.2rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        
        /* Compact Long-Term View */
        #monthly-view {
            max-width: 800px;
        }
        .month-section {
            margin-bottom: 3rem;
        }
        .month-label {
            position: sticky;
            top: 5rem; 
            background: rgba(248, 250, 252, 0.95);
            backdrop-filter: blur(8px);
            padding: 1rem 0;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
            z-index: 10;
            border-bottom: 2px solid var(--border);
            margin-bottom: 1rem;
        }
        .compact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 0.5rem;
        }
        .mini-day {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.5rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        .mini-day.today {
            border: 2px solid #38bdf8;
            background: #f0f9ff;
        }
        .mini-day-header {
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--text-main);
            text-align: center;
            padding-bottom: 0.25rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 0.25rem;
        }
        .mini-tide {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        .mini-tide.high { color: var(--high-tide); }
        .mini-tide.low { color: var(--low-tide); }

        /* Graph View */
        #graph-view {
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
        }
        .graph-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .graph-header h3 {
            margin: 0;
            color: var(--text-main);
        }
        .graph-header p {
            margin: 0.5rem 0 0 0;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        #loader, #graph-loader {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            font-size: 1.1rem;
            width: 100%;
        }
        .error {
            color: #ef4444;
            background: #fef2f2;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            width: 100%;
            max-width: 600px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Avalon Tides</h1>
        <p>Catalina Island, California</p>
    </div>

    <div class="tabs" id="tabs" style="display: none;">
        <button class="tab-btn active" onclick="switchTab('weekly')">7-Day View</button>
        <button class="tab-btn" onclick="switchTab('monthly')">Long-Term View</button>
        <button class="tab-btn" onclick="switchTab('graph')">48-Hour Graph</button>
    </div>

    <div id="loader">Fetching 1 year of tide data...</div>
    <div id="error-container"></div>

    <div id="weekly-view" class="view-container">
        </div>

    <div id="monthly-view" class="view-container">
        </div>

    <div id="graph-view" class="view-container">
        <div class="graph-header">
            <h3>48-Hour Tide Curve</h3>
            <p>Predicted water levels</p>
        </div>
        <div id="graph-loader" style="display:none;">Loading graph data...</div>
        <canvas id="tideChart"></canvas>
    </div>

    <script>
        const station = "9410079";
        let allHiLoTides = []; 
        let graphDataLoaded = false;
        let tideChartInstance = null;

        const todayStrLocal = getLocalTodayStr();

        function getLocalTodayStr() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        function formatDateForAPI(date) {
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            return `${yyyy}${mm}${dd}`;
        }

        async function init() {
            // Pull exactly 1 year of High/Low data for the first two tabs
            const localNow = new Date();
            const endDate = new Date(localNow);
            endDate.setFullYear(localNow.getFullYear() + 1); 

            const url = `https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?begin_date=${formatDateForAPI(localNow)}&end_date=${formatDateForAPI(endDate)}&station=${station}&product=predictions&datum=MLLW&time_zone=lst_ldt&interval=hilo&units=english&format=json`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                
                if (data.error) throw new Error(data.error.message);
                
                allHiLoTides = data.predictions;
                
                document.getElementById('loader').style.display = 'none';
                document.getElementById('tabs').style.display = 'flex';
                
                renderWeekly();
                renderAllMonths();
                document.getElementById('weekly-view').classList.add('active');

            } catch (error) {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('error-container').innerHTML = `
                    <div class="error">
                        Unable to load tide data. Please try again later.
                    </div>
                `;
                console.error("Tide fetch error:", error);
            }
        }

        function switchTab(viewId) {
            // Update Buttons
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // Update Views
            document.querySelectorAll('.view-container').forEach(view => view.classList.remove('active'));
            document.getElementById(viewId + '-view').classList.add('active');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // Load Graph Data on demand if switching to graph tab
            if (viewId === 'graph' && !graphDataLoaded) {
                loadGraphData();
            }
        }

        // --- 7-DAY VIEW LOGIC ---
        function renderWeekly() {
            const container = document.getElementById('weekly-view');
            container.innerHTML = '';
            
            const uniqueDays = new Set();
            const weeklyTides = [];
            
            for(let i = 0; i < allHiLoTides.length; i++) {
                const datePart = allHiLoTides[i].t.split(" ")[0];
                uniqueDays.add(datePart);
                if(uniqueDays.size <= 7) {
                    weeklyTides.push(allHiLoTides[i]);
                } else {
                    break;
                }
            }
            
            const grouped = groupTidesByDay(weeklyTides);

            for (const [dateStr, tides] of Object.entries(grouped)) {
                const dateObj = new Date(dateStr + "T12:00:00");
                const isToday = dateStr === todayStrLocal;
                
                const dateDisplay = new Intl.DateTimeFormat('en-US', { 
                    weekday: 'long', month: 'long', day: 'numeric' 
                }).format(dateObj);

                const card = document.createElement('div');
                card.className = `day-card ${isToday ? 'today' : ''}`;
                
                let cardHTML = `<div class="day-header">${isToday ? 'Today &bull; ' : ''}${dateDisplay}</div>`;
                
                tides.forEach(tide => {
                    const timeDisplay = formatStandardTime(tide.t.split(" ")[1]);
                    const isHigh = tide.type === 'H';
                    const icon = isHigh ? '▲' : '▼';
                    
                    cardHTML += `
                        <div class="tide-row">
                            <div class="tide-info">
                                <span class="tide-type ${isHigh ? 'high' : 'low'}">${icon} ${isHigh ? 'High' : 'Low'}</span>
                                <span class="tide-time">${timeDisplay}</span>
                            </div>
                            <span class="tide-height">${parseFloat(tide.v).toFixed(1)} ft</span>
                        </div>
                    `;
                });

                card.innerHTML = cardHTML;
                container.appendChild(card);
            }
        }

        // --- LONG-TERM GRID LOGIC ---
        function renderAllMonths() {
            const container = document.getElementById('monthly-view');
            container.innerHTML = '';

            const monthlyData = {};
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

            allHiLoTides.forEach(tide => {
                const yearMonth = tide.t.substring(0, 7); 
                const datePart = tide.t.split(" ")[0];    
                
                if (!monthlyData[yearMonth]) monthlyData[yearMonth] = {};
                if (!monthlyData[yearMonth][datePart]) monthlyData[yearMonth][datePart] = [];
                
                monthlyData[yearMonth][datePart].push(tide);
            });

            for (const [yearMonth, daysObj] of Object.entries(monthlyData)) {
                const [year, monthStr] = yearMonth.split('-');
                const monthName = monthNames[parseInt(monthStr) - 1];
                
                const section = document.createElement('div');
                section.className = 'month-section';
                
                const header = document.createElement('div');
                header.className = 'month-label';
                header.textContent = `${monthName} ${year}`;
                section.appendChild(header);

                const grid = document.createElement('div');
                grid.className = 'compact-grid';

                for (const [dateStr, tides] of Object.entries(daysObj)) {
                    const dateObj = new Date(dateStr + "T12:00:00");
                    const isToday = dateStr === todayStrLocal;
                    
                    const dayName = new Intl.DateTimeFormat('en-US', { weekday: 'short' }).format(dateObj);
                    const dayNum = dateObj.getDate();

                    const miniCard = document.createElement('div');
                    miniCard.className = `mini-day ${isToday ? 'today' : ''}`;
                    
                    let cardHTML = `<div class="mini-day-header">${dayName} ${dayNum}</div>`;
                    
                    tides.forEach(tide => {
                        const isHigh = tide.type === 'H';
                        const timeStr = formatMiniTime(tide.t.split(" ")[1]);
                        const height = parseFloat(tide.v).toFixed(1);
                        
                        cardHTML += `
                            <div class="mini-tide ${isHigh ? 'high' : 'low'}">
                                <span>${isHigh ? '▲' : '▼'} ${timeStr}</span>
                                <span>${height}'</span>
                            </div>
                        `;
                    });

                    miniCard.innerHTML = cardHTML;
                    grid.appendChild(miniCard);
                }

                section.appendChild(grid);
                container.appendChild(section);
            }
        }

        // --- GRAPH VIEW LOGIC ---
        async function loadGraphData() {
            const loader = document.getElementById('graph-loader');
            loader.style.display = 'block';

            // Fetch 48 hours of 6-minute interval data (not just High/Low)
            const localNow = new Date();
            const endDate = new Date(localNow);
            endDate.setDate(localNow.getDate() + 2); // Next 48 hours

            const url = `https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?begin_date=${formatDateForAPI(localNow)}&end_date=${formatDateForAPI(endDate)}&station=${station}&product=predictions&datum=MLLW&time_zone=lst_ldt&units=english&format=json`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.error) throw new Error(data.error.message);
                
                const labels = [];
                const values = [];

                data.predictions.forEach(item => {
                    // Item format: {t: "2024-05-24 13:06", v: "4.521"}
                    const timePart = item.t.split(" ")[1];
                    labels.push(formatMiniTime(timePart));
                    values.push(parseFloat(item.v));
                });

                renderChart(labels, values);
                graphDataLoaded = true;
                loader.style.display = 'none';

            } catch (error) {
                loader.innerHTML = `<div class="error">Unable to load graph data.</div>`;
                console.error("Graph fetch error:", error);
            }
        }

        function renderChart(labels, dataPoints) {
            const ctx = document.getElementById('tideChart').getContext('2d');
            
            // gradient fill under the line
            const gradient = ctx.createLinearGradient(0, 0, 0, 400);
            gradient.addColorStop(0, 'rgba(14, 165, 233, 0.5)'); // primary blue
            gradient.addColorStop(1, 'rgba(14, 165, 233, 0.0)');

            if(tideChartInstance) {
                tideChartInstance.destroy();
            }

            tideChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Water Level (ft)',
                        data: dataPoints,
                        borderColor: '#0ea5e9',
                        backgroundColor: gradient,
                        borderWidth: 3,
                        pointRadius: 0, // hide dots for smooth line
                        pointHitRadius: 10,
                        fill: true,
                        tension: 0.4 // curve the line
                    }]
                },
                options: {
                    responsive: true,
                    interaction: {
                        intersect: false,
                        mode: 'index',
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            displayColors: false,
                            backgroundColor: 'rgba(30, 41, 59, 0.9)',
                            titleFont: { size: 14 },
                            bodyFont: { size: 16, weight: 'bold' },
                            callbacks: {
                                label: function(context) {
                                    return context.parsed.y.toFixed(2) + ' ft';
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: {
                                maxTicksLimit: 12, // don't crowd the x axis
                                color: '#64748b'
                            }
                        },
                        y: {
                            grid: { color: '#f1f5f9' },
                            ticks: { color: '#64748b' }
                        }
                    }
                }
            });
        }

        // --- UTILS ---
        function groupTidesByDay(tidesArray) {
            const grouped = {};
            tidesArray.forEach(item => {
                const datePart = item.t.split(" ")[0];
                if(!grouped[datePart]) grouped[datePart] = [];
                grouped[datePart].push(item);
            });
            return grouped;
        }

        function formatStandardTime(time24) {
            const [hour, minute] = time24.split(":");
            const timeObj = new Date();
            timeObj.setHours(hour, minute);
            return new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: '2-digit' }).format(timeObj);
        }

        function formatMiniTime(time24) {
            let [h, m] = time24.split(':');
            let ampm = 'a';
            h = parseInt(h);
            if (h >= 12) {
                ampm = 'p';
                if (h > 12) h -= 12;
            }
            if (h === 0) h = 12;
            return `${h}:${m}${ampm}`;
        }

        // Boot it up
        init();
    </script>
</body>
</html>
