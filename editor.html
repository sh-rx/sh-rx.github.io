<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff Editor</title>
<style>
  :root {
    --bg:        #16181c;
    --panel:     #1e2127;
    --panel-2:   #262a32;
    --line:      #333842;
    --line-soft: #2a2e36;
    --text:      #e3e6ea;
    --text-dim:  #949cab;
    --text-mute: #646b78;
    --accent:    #5b8bb8;
    --accent-dk: #3d6484;
    --ok:        #3f8f4a;
    --short:     #c0392b;
    --over:      #d9822b;
    --float:     #d9a441;
    --danger:    #b8433a;
    --radius:    6px;
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--text);
    margin: 0; height: 100vh; overflow: hidden;
    display: flex; font-size: 14px; line-height: 1.5;
  }

  /* ---------- sidebar ---------- */
  .sidebar {
    width: 300px; flex-shrink: 0; background: var(--panel);
    border-right: 1px solid var(--line); display: flex; flex-direction: column;
  }
  .sidebar-head { padding: 16px; border-bottom: 1px solid var(--line); }
  .sidebar-title {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
  }
  .sidebar-title h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .sidebar-title .n { color: var(--text-mute); font-size: 12px; font-weight: 500; }

  .search {
    width: 100%; padding: 8px 10px; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 4px; font-family: inherit; font-size: 13px;
  }
  .search::placeholder { color: var(--text-mute); }

  .emp-list { flex: 1; overflow-y: auto; }
  .emp-item {
    padding: 11px 16px; border-bottom: 1px solid var(--line-soft);
    cursor: pointer; border-left: 3px solid transparent;
  }
  .emp-item:hover { background: var(--panel-2); }
  .emp-item.active { background: var(--accent-dk); border-left-color: var(--accent); }
  .emp-item .nm { font-weight: 600; font-size: 13.5px; }
  .emp-item .sub { font-size: 11.5px; color: var(--text-mute); margin-top: 2px; }
  .emp-item.active .sub { color: #c4d7e6; }
  .emp-item.flagged .nm::after {
    content: '!'; display: inline-block; margin-left: 6px;
    background: var(--over); color: #fff; font-size: 10px; font-weight: 700;
    width: 14px; height: 14px; line-height: 14px; text-align: center;
    border-radius: 50%; vertical-align: 1px;
  }

  /* ---------- main ---------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    padding: 12px 24px; background: var(--panel);
    border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
  }
  .topbar h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .dirty-dot {
    display: none; width: 7px; height: 7px; border-radius: 50%;
    background: var(--over); margin-left: 8px; vertical-align: 2px;
  }
  body.dirty .dirty-dot { display: inline-block; }
  .topbar-actions { display: flex; gap: 8px; align-items: center; }

  .view-tabs { display: flex; gap: 6px; padding: 12px 24px 0; }
  .tab {
    background: transparent; border: 1px solid var(--line); color: var(--text-dim);
    padding: 7px 14px; border-radius: 4px; cursor: pointer;
    font-weight: 600; font-family: inherit; font-size: 13px;
  }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .tab .count {
    margin-left: 6px; font-weight: 700; font-size: 11px;
    padding: 1px 5px; border-radius: 8px; background: var(--over); color: #fff;
  }
  .tab.active .count { background: var(--bg); color: var(--text); }
  .tab .count.zero { display: none; }

  .scroll { flex: 1; overflow-y: auto; }
  .pane { display: none; padding: 22px 24px 60px; max-width: 980px; }
  .pane.active { display: block; }

  /* ---------- buttons ---------- */
  .btn {
    padding: 8px 15px; background: var(--accent-dk); color: #fff; border: none;
    cursor: pointer; font-size: 13px; border-radius: 4px; font-weight: 600;
    font-family: inherit; transition: background .15s; white-space: nowrap;
  }
  .btn:hover:not(:disabled) { background: var(--accent); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--text-dim); }
  .btn.ghost:hover { background: var(--panel-2); color: var(--text); }
  .btn.danger { background: transparent; border: 1px solid var(--danger); color: #e08a83; }
  .btn.danger:hover { background: var(--danger); color: #fff; }
  .btn.tiny { padding: 3px 9px; font-size: 11.5px; }

  /* ---------- form ---------- */
  .section { margin-bottom: 28px; }
  .section > h3 {
    margin: 0 0 10px; font-size: 11px; font-weight: 700; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: .06em;
    display: flex; align-items: center; gap: 10px;
  }
  .hint { font-size: 12px; color: var(--text-mute); margin: -4px 0 10px; font-weight: 400; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.full { grid-column: 1 / -1; }
  label { font-weight: 600; color: var(--text-dim); font-size: 12px;
          text-transform: uppercase; letter-spacing: .04em; }
  input[type="text"], input[type="number"], input[type="date"], select {
    padding: 9px 10px; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 4px;
    font-size: 14px; font-family: inherit; color-scheme: dark; width: 100%;
  }
  input:focus, select:focus, .search:focus {
    outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent);
  }

  /* ---------- chips ---------- */
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    padding: 6px 12px; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 14px; font-size: 12.5px; cursor: pointer; user-select: none;
    font-weight: 500; transition: all .12s;
  }
  .chip:hover:not(.locked) { border-color: var(--accent-dk); color: #fff; }
  .chip.on { background: var(--accent-dk); border-color: var(--accent); color: #fff; font-weight: 600; }
  .chip.on.backup { background: #7a5c1e; border-color: var(--float); }
  .chip.locked { opacity: .3; cursor: not-allowed; }
  .chip .hrs { opacity: .6; font-size: 11px; margin-left: 4px; }

  /* ---------- dynamic rows ---------- */
  .rows { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row select { flex: 0 0 140px; }
  .row input { flex: 1; }
  .none { color: var(--text-mute); font-size: 12.5px; font-style: italic; }

  /* ---------- banners / tables ---------- */
  .banner { border-radius: var(--radius); padding: 13px 15px; margin-bottom: 14px;
            border: 1px solid; font-size: 13px; }
  .banner h4 { margin: 0 0 7px; font-size: 12px; font-weight: 700;
               text-transform: uppercase; letter-spacing: .05em; }
  .banner ul { margin: 0; padding-left: 18px; }
  .banner li { margin-bottom: 4px; }
  .banner li:last-child { margin-bottom: 0; }
  .banner.err  { background: #2a1618; border-color: #7d2b2b; color: #f0b4b4; }
  .banner.warn { background: #2a2216; border-color: #7d5c2b; color: #e8cd9a; }
  .banner.ok   { background: #16261a; border-color: #2b6b33; color: #a8d8b0; }
  .banner.info { background: #16202a; border-color: #2b5c7d; color: #a8c9e0; }
  .banner .who { font-weight: 700; }

  .stats { display: grid; gap: 12px; margin-bottom: 18px;
           grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .stat { background: var(--panel); border: 1px solid var(--line);
          border-radius: var(--radius); padding: 13px 15px; }
  .stat .n { font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
  .stat .k { font-size: 11px; color: var(--text-mute); text-transform: uppercase;
             letter-spacing: .05em; margin-top: 2px; }
  .neg { color: #e08585; } .pos { color: #e0b385; }

  table { width: 100%; border-collapse: collapse; border: 1px solid var(--line);
          border-radius: var(--radius); overflow: hidden; }
  th { background: var(--panel-2); text-align: left; padding: 9px 12px; font-size: 11px;
       text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim); }
  td { padding: 8px 12px; border-top: 1px solid var(--line-soft); font-size: 13px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.risk td { background: #251a1a; }

  /* ---------- toast ---------- */
  #toast {
    position: fixed; bottom: 22px; right: 22px; padding: 13px 20px;
    border-radius: var(--radius); font-weight: 600; font-size: 13.5px;
    transform: translateY(180%); transition: transform .28s ease; z-index: 100;
    background: var(--ok); color: #fff; max-width: 380px;
  }
  #toast.show { transform: translateY(0); }
  #toast.bad { background: var(--danger); }

  .empty-state { padding: 60px 24px; color: var(--text-mute); text-align: center; }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-head">
    <div class="sidebar-title">
      <h2>Staff</h2>
      <span class="n" id="staffCount"></span>
    </div>
    <input class="search" id="search" placeholder="Filter by name or shift" oninput="renderList()">
    <div style="margin-top:10px"><button class="btn" style="width:100%" onclick="addEmployee()">Add person</button></div>
  </div>
  <div class="emp-list" id="empList"></div>
</div>

<div class="main">
  <div class="topbar">
    <h2><span id="topbarName">Staff editor</span><span class="dirty-dot" title="Unsaved changes"></span></h2>
    <div class="topbar-actions">
      <button class="btn ghost" onclick="goToScheduler()">Schedule generator</button>
      <button class="btn ghost" onclick="revert()">Revert</button>
      <button class="btn" id="saveBtn" onclick="save()">Save to server</button>
    </div>
  </div>

  <div class="view-tabs">
    <button class="tab active" data-pane="person" onclick="showPane('person')">Person</button>
    <button class="tab" data-pane="health" onclick="showPane('health')">Roster health<span class="count zero" id="issueCount">0</span></button>
    <button class="tab" data-pane="coverage" onclick="showPane('coverage')">Shift coverage</button>
  </div>

  <div class="scroll">
    <div class="pane active" id="pane-person">
      <div class="empty-state" id="personEmpty">Pick someone from the list, or add a new person.</div>
      <div id="personForm" style="display:none"></div>
    </div>
    <div class="pane" id="pane-health"></div>
    <div class="pane" id="pane-coverage"></div>
  </div>
</div>

<div id="toast"></div>

<script>
const API = 'https://bombmud.vineyard.haus/api';

// Mirrors SHIFT_CONFIG in app.py. Replaced by GET /config at boot so the two
// never drift; this is only the offline fallback.
let SHIFT_CONFIG = [
  { name: "ED Day",     hours: 12, required: 2, weekends: true  },
  { name: "ED Ngt",     hours: 10, required: 1, weekends: true  },
  { name: "ICU",        hours: 10, required: 1, weekends: true  },
  { name: "CVCU",       hours: 10, required: 1, weekends: true  },
  { name: "ICU Swg",    hours: 10, required: 1, weekends: true  },
  { name: "Onc",        hours: 10, required: 1, weekends: true  },
  { name: "Med",        hours: 10, required: 2, weekends: false },
  { name: "MedSurg",    hours: 10, required: 1, weekends: true  },
  { name: "D5",         hours: 10, required: 1, weekends: true  },
  { name: "FBC",        hours: 10, required: 1, weekends: true  },
  { name: "IP Day",     hours: 10, required: 2, weekends: true  },
  { name: "IWC",        hours: 10, required: 1, weekends: false },
  { name: "OR",         hours: 10, required: 1, weekends: false },
  { name: "IV Day",     hours: 10, required: 2, weekends: true  },
  { name: "IV Swg",     hours: 10, required: 1, weekends: true  },
  { name: "IV Ngt",     hours: 10, required: 1, weekends: true  },
  { name: "IP Day Res", hours: 10, required: 1, weekends: true  },
  { name: "Swg Res",    hours: 10, required: 1, weekends: true  },
  { name: "IP Ngt",     hours: 10, required: 1, weekends: true  },
];
let DEFAULT_MAX_WEEKLY = 40;

const WEEKDAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

let staff = [];
let saved = '[]';       // JSON snapshot of the last server state
let currentId = null;   // selection is by ID, never by array index
let issues = { errors: [], warnings: [], byId: {} };

const shiftNames = () => SHIFT_CONFIG.map(s => s.name);
const shiftMeta  = n => SHIFT_CONFIG.find(s => s.name === n) || { hours: 10, required: 1, weekends: true };
const current    = () => staff.find(e => e.id === currentId) || null;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
(async function boot() {
  try {
    const cfg = await fetch(API + '/config');
    if (cfg.ok) {
      const j = await cfg.json();
      if (j.shifts?.length) SHIFT_CONFIG = j.shifts;
      if (j.default_max_weekly_hours) DEFAULT_MAX_WEEKLY = j.default_max_weekly_hours;
    }
  } catch (e) { /* fall back to the local copy above */ }

  try {
    const res = await fetch(API + '/staff');
    if (!res.ok) throw new Error('Server returned ' + res.status);
    staff = (await res.json()).map(normalize);
    saved = JSON.stringify(staff);
    refresh();
  } catch (e) {
    toast('Could not load staff: ' + e.message, true);
    document.getElementById('empList').innerHTML =
      `<div class="empty-state">No connection to the staff API.</div>`;
  }
})();

// Legacy records are missing newer fields. Fill them in once, on load, so no
// downstream code has to guard against undefined arrays.
function normalize(e) {
  return {
    id: e.id,
    name: e.name || '',
    home_shifts: Array.isArray(e.home_shifts) ? e.home_shifts.slice() : [],
    backup_shifts: Array.isArray(e.backup_shifts) ? e.backup_shifts.slice() : [],
    rotation: e.rotation ?? null,
    target_hours: Number(e.target_hours) || 0,
    max_weekly_hours: Number(e.max_weekly_hours) || DEFAULT_MAX_WEEKLY,
    weekend_preference: e.weekend_preference || 'target_equity',
    unavailable_weekdays: Array.isArray(e.unavailable_weekdays) ? e.unavailable_weekdays.slice() : [],
    biweekly_unavailable: Array.isArray(e.biweekly_unavailable) ? e.biweekly_unavailable.slice() : [],
    requested_days_off: Array.isArray(e.requested_days_off) ? e.requested_days_off.slice() : [],
  };
}

function isDirty() { return JSON.stringify(staff) !== saved; }
function markDirty() { document.body.classList.toggle('dirty', isDirty()); }

function refresh() {
  validate();
  renderList();
  renderPerson();
  renderHealth();
  renderCoverage();
  markDirty();
}

// ---------------------------------------------------------------------------
// Validation — mirrors run_prechecks() in app.py so problems surface here,
// where they can be fixed, instead of at generate time.
// ---------------------------------------------------------------------------
function validate() {
  const errors = [], warnings = [], byId = {};
  const flag = (id, msg, level) => {
    (byId[id] = byId[id] || []).push({ msg, level });
    (level === 'error' ? errors : warnings).push({ id, msg });
  };

  const idCount = {};
  staff.forEach(e => { idCount[e.id] = (idCount[e.id] || 0) + 1; });

  const anchors = {};   // "rotation|shift" -> [names]

  staff.forEach(e => {
    if (idCount[e.id] > 1) flag(e.id, `Employee ID ${e.id} is used more than once.`, 'error');
    if (!e.name.trim()) flag(e.id, 'This person has no name.', 'error');

    const home = e.home_shifts, backup = e.backup_shifts;

    if (!home.length && !backup.length)
      flag(e.id, 'No home or backup shifts, so this person can never be scheduled.', 'warning');

    const overlap = backup.filter(s => home.includes(s));
    if (overlap.length)
      flag(e.id, `${overlap.join(', ')} listed as both home and backup. Home wins.`, 'warning');

    if (e.rotation) {
      if (!home.length) {
        flag(e.id, `On rotation ${e.rotation} but has no home shift to anchor to.`, 'error');
      } else {
        const anchor = home[0];
        const key = e.rotation + '|' + anchor;
        (anchors[key] = anchors[key] || []).push(e.name);
        if (!shiftMeta(anchor).weekends)
          flag(e.id, `Anchored to ${anchor} on a 7-on/7-off rotation, but ${anchor} does not run weekends.`, 'error');
        if (home.length > 1)
          flag(e.id, `Rotational staff are locked to their first home shift (${anchor}). The others are ignored.`, 'warning');
      }
      if (e.unavailable_weekdays.length || e.biweekly_unavailable.length || e.requested_days_off.length)
        flag(e.id, 'Rotational, but also has time-off rules. Those days drop out of the rotation and leave the shift empty.', 'warning');
    } else {
      // Reachable hours under the weekly cap
      const pool = [...new Set([...home, ...backup])];
      if (pool.length && e.target_hours > 0) {
        // Pack the week with whichever single shift length fills the cap best.
        const ceiling = Math.max(...pool.map(s => {
          const h = shiftMeta(s).hours;
          return Math.floor(e.max_weekly_hours / h) * h;
        })) * 2;
        if (ceiling < e.target_hours)
          flag(e.id, `Targets ${e.target_hours} h per period, but a ${e.max_weekly_hours} h weekly cap tops out at ${ceiling} h given their shift lengths. Raise the weekly cap or lower the target.`, 'warning');
      }
    }

    if (e.requested_days_off.some(d => !d))
      flag(e.id, 'Has a blank day-off entry. Fill it in or remove it.', 'warning');
    if (e.biweekly_unavailable.some(r => !r.anchor_date))
      flag(e.id, 'Has a bi-weekly rule with no anchor date, so it will be ignored.', 'warning');
    if (e.target_hours <= 0)
      flag(e.id, 'Target hours is zero, so no hours target will be enforced.', 'warning');
  });

  // Two people anchored to the same rotation and shift
  Object.entries(anchors).forEach(([key, names]) => {
    if (names.length > 1) {
      const [rot, shift] = key.split('|');
      errors.push({ id: null, msg: `Two rotation-${rot} anchors on ${shift}: ${names.join(', ')}.` });
    }
  });

  // Every shift needs an A and a B, or half the weeks go uncovered
  shiftNames().forEach(shift => {
    const present = ['A','B'].filter(r => anchors[r + '|' + shift]);
    if (present.length === 1) {
      const missing = present[0] === 'A' ? 'B' : 'A';
      warnings.push({ id: null, msg: `${shift} has a rotation-${present[0]} anchor but no rotation-${missing} counterpart. Half of all weeks will be uncovered.` });
    }
  });

  // Shifts nobody can cover
  shiftNames().forEach(shift => {
    const pool = staff.filter(e => e.home_shifts.includes(shift) || e.backup_shifts.includes(shift));
    if (!pool.length) {
      errors.push({ id: null, msg: `Nobody is qualified for ${shift}. It can never be filled.` });
    } else if (shiftMeta(shift).weekends && !pool.some(e => e.weekend_preference !== 'never')) {
      errors.push({ id: null, msg: `${shift} runs on weekends, but everyone qualified for it is set to never work weekends.` });
    }
  });

  issues = { errors, warnings, byId };
  const n = errors.length + warnings.length;
  const badge = document.getElementById('issueCount');
  badge.textContent = n;
  badge.classList.toggle('zero', n === 0);
}

function capacity() {
  const demandPerPeriod = SHIFT_CONFIG.reduce((t, s) =>
    t + s.required * s.hours * (s.weekends ? 14 : 10), 0);
  const supplyPerPeriod = staff.reduce((t, e) => t + (e.target_hours || 0), 0);
  return {
    demand: demandPerPeriod,
    supply: supplyPerPeriod,
    slack: supplyPerPeriod - demandPerPeriod,
    util: supplyPerPeriod ? Math.round(1000 * demandPerPeriod / supplyPerPeriod) / 10 : 0,
  };
}

// ---------------------------------------------------------------------------
// Sidebar
// ---------------------------------------------------------------------------
function renderList() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const view = [...staff].sort((a, b) => a.name.localeCompare(b.name)).filter(e =>
    !q || e.name.toLowerCase().includes(q) ||
    [...e.home_shifts, ...e.backup_shifts].some(s => s.toLowerCase().includes(q)));

  document.getElementById('staffCount').textContent =
    q ? `${view.length} of ${staff.length}` : `${staff.length}`;

  const list = document.getElementById('empList');
  if (!view.length) {
    list.innerHTML = `<div class="empty-state">No matches.</div>`;
    return;
  }

  list.innerHTML = view.map(e => {
    const bits = [];
    if (e.rotation) bits.push('Rotation ' + e.rotation);
    if (e.home_shifts.length) bits.push(e.home_shifts.join(' / '));
    bits.push(e.target_hours + ' h');
    const flagged = (issues.byId[e.id] || []).length ? ' flagged' : '';
    return `<div class="emp-item${e.id === currentId ? ' active' : ''}${flagged}" onclick="select(${e.id})">
      <div class="nm">${esc(e.name || 'Unnamed')}</div>
      <div class="sub">${esc(bits.join(' · '))}</div>
    </div>`;
  }).join('');
}

function select(id) {
  currentId = id;
  renderList();
  renderPerson();
  showPane('person');
}

// ---------------------------------------------------------------------------
// Person form
// ---------------------------------------------------------------------------
function renderPerson() {
  const e = current();
  const empty = document.getElementById('personEmpty');
  const form = document.getElementById('personForm');

  if (!e) {
    empty.style.display = '';
    form.style.display = 'none';
    document.getElementById('topbarName').textContent = 'Staff editor';
    return;
  }
  empty.style.display = 'none';
  form.style.display = '';
  document.getElementById('topbarName').textContent = e.name || 'Unnamed';

  const myIssues = issues.byId[e.id] || [];
  const issueHtml = myIssues.length ? `
    <div class="banner ${myIssues.some(i => i.level === 'error') ? 'err' : 'warn'}">
      <h4>${myIssues.length} issue${myIssues.length > 1 ? 's' : ''} on this record</h4>
      <ul>${myIssues.map(i => `<li>${esc(i.msg)}</li>`).join('')}</ul>
    </div>` : '';

  const homeChips = shiftNames().map(s => {
    const on = e.home_shifts.includes(s);
    return `<div class="chip ${on ? 'on' : ''}" onclick="toggleShift('home_shifts','${esc(s)}')">${esc(s)}<span class="hrs">${shiftMeta(s).hours}h</span></div>`;
  }).join('');

  const backupChips = shiftNames().map(s => {
    const isHome = e.home_shifts.includes(s);
    const on = e.backup_shifts.includes(s);
    return `<div class="chip ${on ? 'on backup' : ''} ${isHome ? 'locked' : ''}"
      ${isHome ? 'title="Already a home shift"' : `onclick="toggleShift('backup_shifts','${esc(s)}')"`}
      >${esc(s)}<span class="hrs">${shiftMeta(s).hours}h</span></div>`;
  }).join('');

  const weekdayChips = WEEKDAYS.map(d => {
    const on = e.unavailable_weekdays.includes(d);
    return `<div class="chip ${on ? 'on' : ''}" onclick="toggleShift('unavailable_weekdays','${d}')">${d}</div>`;
  }).join('');

  const daysOff = e.requested_days_off.length
    ? e.requested_days_off.map((d, i) => `
        <div class="row">
          <input type="date" value="${esc(d)}" onchange="setArray('requested_days_off',${i},this.value)">
          <button class="btn danger tiny" onclick="removeAt('requested_days_off',${i})">Remove</button>
        </div>`).join('')
    : '<div class="none">None</div>';

  const biweekly = e.biweekly_unavailable.length
    ? e.biweekly_unavailable.map((r, i) => `
        <div class="row">
          <select onchange="setBiweekly(${i},'day',this.value)">
            ${WEEKDAYS.map(d => `<option ${r.day === d ? 'selected' : ''}>${d}</option>`).join('')}
          </select>
          <input type="date" value="${esc(r.anchor_date || '')}" onchange="setBiweekly(${i},'anchor_date',this.value)">
          <button class="btn danger tiny" onclick="removeAt('biweekly_unavailable',${i})">Remove</button>
        </div>`).join('')
    : '<div class="none">None</div>';

  form.innerHTML = `
    ${issueHtml}

    <div class="section">
      <h3>Basics</h3>
      <div class="grid">
        <div class="field full">
          <label for="fName">Full name</label>
          <input type="text" id="fName" value="${esc(e.name)}" placeholder="Last, First"
                 oninput="setField('name', this.value)">
        </div>
        <div class="field">
          <label for="fTarget">Target hours per pay period</label>
          <input type="number" id="fTarget" min="0" max="200" step="5" value="${e.target_hours}"
                 oninput="setField('target_hours', parseInt(this.value) || 0)">
        </div>
        <div class="field">
          <label for="fCap">Weekly hour cap</label>
          <input type="number" id="fCap" min="0" max="84" step="4" value="${e.max_weekly_hours}"
                 oninput="setField('max_weekly_hours', parseInt(this.value) || 0)">
        </div>
        <div class="field">
          <label for="fRot">Rotation</label>
          <select id="fRot" onchange="setField('rotation', this.value || null)">
            <option value="" ${!e.rotation ? 'selected' : ''}>None</option>
            <option value="A" ${e.rotation === 'A' ? 'selected' : ''}>A — week 1 of each period</option>
            <option value="B" ${e.rotation === 'B' ? 'selected' : ''}>B — week 2 of each period</option>
          </select>
        </div>
        <div class="field">
          <label for="fWknd">Weekends</label>
          <select id="fWknd" onchange="setField('weekend_preference', this.value)">
            <option value="target_equity" ${e.weekend_preference === 'target_equity' ? 'selected' : ''}>Fair share</option>
            <option value="any" ${e.weekend_preference === 'any' ? 'selected' : ''}>No preference</option>
            <option value="never" ${e.weekend_preference === 'never' ? 'selected' : ''}>Never</option>
          </select>
        </div>
      </div>
      ${e.rotation ? `<div class="banner info" style="margin-top:14px">
        Rotational staff work 7 on, 7 off, locked to their first home shift. The hours
        target and weekly cap do not apply to them.</div>` : ''}
    </div>

    <div class="section">
      <h3>Home shifts</h3>
      <div class="hint">The units this person normally covers.${e.rotation ? ' The first one is their rotation anchor.' : ''}</div>
      <div class="chips">${homeChips}</div>
    </div>

    <div class="section">
      <h3>Backup shifts</h3>
      <div class="hint">Units this person can float to. The solver uses these only when a home unit cannot be covered.</div>
      <div class="chips">${backupChips}</div>
    </div>

    <div class="section">
      <h3>Never available on</h3>
      <div class="hint">Every week, without exception.</div>
      <div class="chips">${weekdayChips}</div>
    </div>

    <div class="section">
      <div class="grid">
        <div class="field">
          <h3>Requested days off <button class="btn ghost tiny" onclick="addDayOff()">Add date</button></h3>
          <div class="rows">${daysOff}</div>
        </div>
        <div class="field">
          <h3>Every other week <button class="btn ghost tiny" onclick="addBiweekly()">Add rule</button></h3>
          <div class="hint">Pick a weekday and one date it falls on. That date repeats every 14 days.</div>
          <div class="rows">${biweekly}</div>
        </div>
      </div>
    </div>

    <div class="section" style="border-top:1px solid var(--line); padding-top:20px">
      <button class="btn danger" onclick="removeEmployee()">Delete ${esc(e.name || 'this person')}</button>
    </div>
  `;
}

// ---------------------------------------------------------------------------
// Mutations. Text inputs re-validate without rebuilding the form, so focus and
// caret position survive typing. Everything else does a full refresh.
// ---------------------------------------------------------------------------
function setField(field, value) {
  const e = current(); if (!e) return;
  e[field] = value;
  if (field === 'name') document.getElementById('topbarName').textContent = value || 'Unnamed';
  validate(); renderList(); markDirty();
}

function toggleShift(field, value) {
  const e = current(); if (!e) return;
  const i = e[field].indexOf(value);
  if (i >= 0) e[field].splice(i, 1); else e[field].push(value);
  // Dropping a home shift should not silently orphan it in backup.
  if (field === 'home_shifts' && i < 0) {
    const b = e.backup_shifts.indexOf(value);
    if (b >= 0) e.backup_shifts.splice(b, 1);
  }
  refresh();
}

function setArray(field, index, value) {
  const e = current(); if (!e) return;
  e[field][index] = value;
  validate(); renderList(); markDirty();
}

function removeAt(field, index) {
  const e = current(); if (!e) return;
  e[field].splice(index, 1);
  refresh();
}

function setBiweekly(index, key, value) {
  const e = current(); if (!e) return;
  e.biweekly_unavailable[index][key] = value;
  validate(); renderList(); markDirty();
}

function addDayOff() {
  const e = current(); if (!e) return;
  e.requested_days_off.push('');
  refresh();
}

function addBiweekly() {
  const e = current(); if (!e) return;
  e.biweekly_unavailable.push({ day: 'Monday', anchor_date: '' });
  refresh();
}

function addEmployee() {
  const nextId = staff.reduce((m, e) => Math.max(m, e.id), -1) + 1;
  const e = normalize({ id: nextId, name: '', target_hours: 80 });
  staff.push(e);
  currentId = nextId;
  document.getElementById('search').value = '';
  refresh();
  showPane('person');
  setTimeout(() => document.getElementById('fName')?.focus(), 20);
}

function removeEmployee() {
  const e = current(); if (!e) return;
  if (!confirm(`Delete ${e.name || 'this person'}? This is not saved until you press Save.`)) return;
  staff = staff.filter(x => x.id !== e.id);
  currentId = null;
  refresh();
}

// ---------------------------------------------------------------------------
// Health + coverage panes
// ---------------------------------------------------------------------------
function renderHealth() {
  const c = capacity();
  const nameOf = id => staff.find(e => e.id === id)?.name || '';
  const line = i => i.id != null
    ? `<li><span class="who">${esc(nameOf(i.id))}</span> — ${esc(i.msg)}</li>`
    : `<li>${esc(i.msg)}</li>`;

  let html = `
    <div class="stats">
      <div class="stat"><div class="n">${c.demand}</div><div class="k">Hours demanded / period</div></div>
      <div class="stat"><div class="n">${c.supply}</div><div class="k">Hours of staff targets</div></div>
      <div class="stat"><div class="n ${c.slack < 0 ? 'neg' : 'pos'}">${c.slack > 0 ? '+' : ''}${c.slack}</div><div class="k">Slack</div></div>
      <div class="stat"><div class="n">${c.util}%</div><div class="k">Utilization</div></div>
    </div>`;

  if (c.slack > c.demand * 0.05) {
    html += `<div class="banner warn"><h4>More staff hours than shifts to put them in</h4>
      Targets exceed demand by ${c.slack} hours per pay period. Most people cannot reach
      their target because there is no slot left to fill. Either raise the required
      headcount on the units that genuinely run more than one nurse, or lower the targets
      to match what the schedule can absorb.</div>`;
  } else if (c.slack < 0) {
    html += `<div class="banner warn"><h4>More shifts than staff hours</h4>
      Demand exceeds targets by ${-c.slack} hours per pay period. Expect overtime,
      unfilled slots, or both.</div>`;
  }

  if (issues.errors.length) {
    html += `<div class="banner err"><h4>${issues.errors.length} blocking problem${issues.errors.length > 1 ? 's' : ''}</h4>
      <ul>${issues.errors.map(line).join('')}</ul></div>`;
  }
  if (issues.warnings.length) {
    html += `<div class="banner warn"><h4>${issues.warnings.length} thing${issues.warnings.length > 1 ? 's' : ''} to look at</h4>
      <ul>${issues.warnings.map(line).join('')}</ul></div>`;
  }
  if (!issues.errors.length && !issues.warnings.length) {
    html += `<div class="banner ok"><h4>Nothing flagged</h4>
      Every record passes the same checks the solver runs before it starts.</div>`;
  }

  document.getElementById('pane-health').innerHTML = html;
}

function renderCoverage() {
  const rows = SHIFT_CONFIG.map(s => {
    const home = staff.filter(e => e.home_shifts.includes(s.name));
    const backup = staff.filter(e => e.backup_shifts.includes(s.name) && !e.home_shifts.includes(s.name));
    const rot = staff.filter(e => e.rotation && e.home_shifts[0] === s.name)
                     .map(e => e.rotation).sort().join('/');
    const wkndPool = [...home, ...backup].filter(e => e.weekend_preference !== 'never');
    const daysPerPeriod = s.weekends ? 14 : 10;
    const demand = s.required * s.hours * daysPerPeriod;

    const risky = !home.length && !backup.length
      || (s.weekends && !wkndPool.length)
      || (rot && rot !== 'A/B');

    return `<tr class="${risky ? 'risk' : ''}">
      <td><strong>${esc(s.name)}</strong></td>
      <td class="num">${s.hours}h</td>
      <td class="num">${s.required}</td>
      <td>${s.weekends ? '7 days' : 'Weekdays'}</td>
      <td class="num">${home.length}</td>
      <td class="num">${backup.length}</td>
      <td class="num">${s.weekends ? wkndPool.length : '—'}</td>
      <td>${rot ? esc(rot) : '—'}</td>
      <td class="num">${demand}</td>
    </tr>`;
  }).join('');

  document.getElementById('pane-coverage').innerHTML = `
    <div class="banner info">Hours demanded assumes a full 14-day pay period. Rows in
    red have no qualified staff, no weekend-eligible staff, or an unpaired rotation.</div>
    <table>
      <thead><tr>
        <th>Shift</th><th class="num">Length</th><th class="num">Need</th><th>Runs</th>
        <th class="num">Home</th><th class="num">Backup</th><th class="num">Wknd pool</th>
        <th>Rotation</th><th class="num">Hrs / period</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function showPane(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.pane === name));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + name));
}

// ---------------------------------------------------------------------------
// Save / revert / navigate
// ---------------------------------------------------------------------------
async function save() {
  if (issues.errors.length &&
      !confirm(`${issues.errors.length} blocking problem(s) remain. Save anyway?`)) return;

  // Blank dates would be stored and then silently ignored by the solver.
  const payload = staff.map(e => ({
    ...e,
    name: e.name.trim(),
    requested_days_off: e.requested_days_off.filter(Boolean).sort(),
    biweekly_unavailable: e.biweekly_unavailable.filter(r => r.anchor_date),
  }));

  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  try {
    const res = await fetch(API + '/staff', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.message || 'Server returned ' + res.status);
    staff = payload.map(normalize);
    saved = JSON.stringify(staff);
    refresh();
    toast(body.message || `Saved ${payload.length} records.`);
  } catch (e) {
    toast('Save failed: ' + e.message, true);
  } finally {
    btn.disabled = false;
  }
}

function revert() {
  if (!isDirty()) { toast('Nothing to revert.'); return; }
  if (!confirm('Discard all unsaved changes?')) return;
  staff = JSON.parse(saved).map(normalize);
  if (!staff.some(e => e.id === currentId)) currentId = null;
  refresh();
  toast('Reverted to the last saved version.');
}

function goToScheduler() {
  if (isDirty() && !confirm('You have unsaved changes. Leave without saving?')) return;
  window.location.href = 'schedule.html';
}

window.addEventListener('beforeunload', ev => {
  if (isDirty()) { ev.preventDefault(); ev.returnValue = ''; }
});

window.addEventListener('keydown', ev => {
  if ((ev.metaKey || ev.ctrlKey) && ev.key === 's') { ev.preventDefault(); save(); }
});

let toastTimer;
function toast(msg, bad) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('bad', !!bad);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3600);
}
</script>
</body>
</html>
